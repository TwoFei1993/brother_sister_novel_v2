            - text: 本章要点提纲（点击展开）
          - generic [ref=f1e375]:
            - list [ref=f1e376]:
              - listitem [ref=f1e377]: 营造"被困在某一刻"的窒息感
            - list [ref=f1e378]:
              - listitem [ref=f1e379]:
                - strong [ref=f1e380]: 章末钩子
                - list [ref=f1e381]:
                  - listitem [ref=f1e382]: 林秋在监控里看到"另一个自己"在往货架深处走
                  - listitem [ref=f1e383]: 此刻他正站在第七排货架前
                  - listitem [ref=f1e384]: 货架深处传来脚步声——是往他这个方向来的
            - separator [ref=f1e385]
            - heading "正文" [level=2] [ref=f1e386]
            - paragraph [ref=f1e387]: 林秋花了二十分钟说服自己去看监控。
            - paragraph [ref=f1e388]: 不是不想看。是身体本能地拒绝。人在面对无法解释的事物时，会先拒绝承认它的存在，然后再被迫接受——而"被迫接受"往往比"从未发生"更让人崩溃。
            - paragraph [ref=f1e389]: 他坐在收银台后面，面前是连接监控的旧台式机。屏幕亮起来时，灰白色的监控画面在黑暗的便利店里显得格外刺眼。
            - paragraph [ref=f1e390]: 他先回放了从凌晨一点到现在的录像。
            - paragraph [ref=f1e391]: 01:00——正常。他一个人坐在收银台后面看手机。 01:30——正常。他在补货，弯腰把泡面塞进货架。 02:00——正常。他在擦收银台。 02:30——正常。他去了一趟洗手间，画面里没人，但收银台上多了一杯咖啡。 02:45——正常。
            - paragraph [ref=f1e392]: 03:00——
            - paragraph [ref=f1e393]: 林秋的手停在鼠标上。
            - paragraph [ref=f1e394]: 03:00的画面对应的是便利店大门方向。画面左上角时间戳正常跳动。但门外的卷闸下，玻璃门上映着的不是空荡荡的街道。
            - paragraph [ref=f1e395]: 是一个人。
            - paragraph [ref=f1e396]: 侧身，贴着玻璃，站在门外的黑暗里。只能看到模糊的轮廓，像被水泡过的铅笔画。
            - paragraph [ref=f1e397]: 林秋屏住呼吸，把进度条往回拉了一秒。
            - paragraph [ref=f1e398]: 没有人。
            - paragraph [ref=f1e399]: 再拉回来。
            - paragraph [ref=f1e400]: 又出现了。
            - paragraph [ref=f1e401]: 不是连贯的——是跳帧式的。每隔一秒，玻璃门外的倒影就多一个人形，但人形的边缘模糊不清，像某种尚未加载完成的图像。
            - paragraph [ref=f1e402]: 他点开便利店内部的另一个摄像头。画面里是他常坐的收银台。
            - paragraph [ref=f1e403]: 03:05。03:10。03:15。
            - paragraph [ref=f1e404]: 林秋在画面里。他坐在那里，低头看手机，屏幕的冷光照在他脸上。
            - paragraph [ref=f1e405]: 他记得自己那时候在看什么——外卖群里的差评吐槽。完全正常。
            - paragraph [ref=f1e406]: 03:17。
            - paragraph [ref=f1e407]: 画面里的他抬起了头。
            - paragraph [ref=f1e408]: 不是慢慢抬的。是猛地、骤然地，像被什么惊动。他直直地看向——
            - paragraph [ref=f1e409]: 镜头。
            - paragraph [ref=f1e410]: 林秋的血液凉了半截。
            - paragraph [ref=f1e411]:
              - text: 画面里的"他"看着镜头，但看的不是镜头这个物件。
              - strong [ref=f1e412]: 是镜头后面的人。
            - paragraph [ref=f1e413]: 那个"他"的嘴唇动了一下。
            - paragraph [ref=f1e414]: 林秋把画面放大。画质模糊，色彩有偏差，但他能看出那个口型。
            - paragraph [ref=f1e415]:
              - strong [ref=f1e416]: "\"你找到我了。\""
            - paragraph [ref=f1e417]: 画面里的他说完这句话，便站了起来。但他没有往门口走，也没有往洗手间走。
            - paragraph [ref=f1e418]: 他往便利店深处走去。
            - paragraph [ref=f1e419]: 第三排货架。第四排。第五排。
            - paragraph [ref=f1e420]: 他越走越深，越走越慢，像在寻找什么。林秋看着画面里的自己消失在第七排货架的尽头——监控画面到这里就截止了，因为摄像头只能覆盖到第六排。
            - paragraph [ref=f1e421]: 第七排以后的区域，是监控盲区。
            - paragraph [ref=f1e422]: 林秋慢慢转过头，看向自己身后的便利店深处。
            - paragraph [ref=f1e423]: 第七排货架。那里还亮着一点微弱的橘红色光。蜡烛还在烧。
            - paragraph [ref=f1e424]: 他站起来。椅子在地砖上刮出一声尖锐的响。
            - paragraph [ref=f1e425]: "\"我刚才没有动过。\"他对自己说。声音很轻，像在说服某个不在场的人。\"03:17的时候我在看手机。我没动过。\""
            - paragraph [ref=f1e426]: 他开始往货架深处走。
            - paragraph [ref=f1e427]: 第三排。第四排。第五排。
            - paragraph [ref=f1e428]: 他走得比画面里那个"自己"快。脚步落在地砖上的声音在空荡荡的店里回响，异常清晰。冰柜的嗡鸣声不知什么时候停了，便利店里安静得像一个密封的盒子。
            - paragraph [ref=f1e429]: 第六排货架。
            - paragraph [ref=f1e430]: 前面就是第七排。
            - paragraph [ref=f1e431]: 林秋停下脚步。
            - paragraph [ref=f1e432]: 不是因为害怕。是因为他看到了不该看到的东西。
            - paragraph [ref=f1e433]: 第六排和第七排货架之间的过道——他每天走过无数次的过道——变长了。
            - paragraph [ref=f1e434]:
              - text: 不是错觉。不是光线昏暗造成的视觉误差。是物理意义上的，
              - strong [ref=f1e435]: 变长了
              - text: 。
            - paragraph [ref=f1e436]: 原本只有三步的距离，现在他站在第六排往里看，能看到过道延伸出去至少二十米。两侧的货架在远处变成模糊的色块，像被水稀释过的水彩。
            - paragraph [ref=f1e437]: 而那根蜡烛的光，就在这条变长的过道尽头。
            - paragraph [ref=f1e438]: 林秋站着没动。他的理智告诉他应该退回去，应该报警，应该冲出便利店——但他的脚像被钉在地上。
            - paragraph [ref=f1e439]: 然后他听到了声音。
            - paragraph [ref=f1e440]: 从过道深处传来的。
            - paragraph [ref=f1e441]: 不是蜡烛燃烧的细微爆裂。是脚步。
            - paragraph [ref=f1e442]: 有人正在往他这个方向走。
            - paragraph [ref=f1e443]: 每一步都踩在过道中央，每一步都不紧不慢，每一步的间隔都非常均匀——像节拍器。
            - paragraph [ref=f1e444]: 而那个脚步声的节奏，林秋再熟悉不过。
            - paragraph [ref=f1e445]: 那是他自己走路的节奏。
            - paragraph [ref=f1e446]: 过道深处的橘红色光开始晃动了。是有人走过的气流带动的烛焰。烛光把一个影子投在第六排货架的侧面——
            - paragraph [ref=f1e447]: 影子的轮廓，是林秋的轮廓。
            - paragraph [ref=f1e448]: 肩膀的高度。头发的长度。甚至右肩微微下沉的习惯性姿势。
            - paragraph [ref=f1e449]: 那个"他"正在走过来。越来越近。
            - paragraph [ref=f1e450]: 林秋终于动了一下。他往后退了半步，背撞到了第六排货架的边缘，货架上的薯片袋发出窸窣的响。
            - paragraph [ref=f1e451]: 脚步声停了。
            - paragraph [ref=f1e452]: 过道深处，烛光稳稳地燃着。
            - paragraph [ref=f1e453]: 一个声音从黑暗中传来。是他的声音。沙哑的，带着一种难以形容的疲惫：
            - paragraph [ref=f1e454]:
              - strong [ref=f1e455]: "\"……你比我当时还慢。\""
            - paragraph [ref=f1e456]:
              - strong [ref=f1e457]: "\"我等了你很久。\""
            - paragraph [ref=f1e458]: 烛光后面，缓缓走出一个人。
            - paragraph [ref=f1e459]: 穿着便利店的工服。脸和监控里一样模糊，五官像被水泡过。但那个姿态，那个右肩微微下沉的习惯，那个说话前先吞咽口水的小动作——
            - paragraph [ref=f1e460]: 是林秋。
            - paragraph [ref=f1e461]: 是他自己。
            - paragraph [ref=f1e462]: 那个"他"举起了手里的东西。
            - paragraph [ref=f1e463]: 是一根白色的蜡烛。没有点燃。
            - paragraph [ref=f1e464]:
              - strong [ref=f1e465]: "\"还剩两根。\""
              - text: 那个"他"说，声音平静得像在念一份收据，
              - strong [ref=f1e466]: "\"一根给你。一根给我。\""
            - paragraph [ref=f1e467]:
              - strong [ref=f1e468]: "\"但你要先回答我一个问题。\""
            - paragraph [ref=f1e469]:
              - strong [ref=f1e470]: "\"——你还记得自己是怎么进来的吗？\""
            - paragraph [ref=f1e471]: 林秋的瞳孔猛地收缩。
            - paragraph [ref=f1e472]: 他想回答。他当然记得。他是今天下午两点来上班的，从员工通道进来的，刷卡，签到，换工服。一切正常。
            - paragraph [ref=f1e473]: 但当他试图回忆那个画面时，他的脑子里只有一片空白。
            - paragraph [ref=f1e474]:
              - text: 不是"忘了"。是
              - strong [ref=f1e475]: 根本不存在
              - text: 。
            - paragraph [ref=f1e476]: 他没有任何关于"今天下午两点上班"的记忆。他只记得自己"一直"在这里。从凌晨一点到现在的每一秒，他都在这里。中间没有"之前"。
            - paragraph [ref=f1e477]: 林秋张了张嘴，什么都说不出来。
            - paragraph [ref=f1e478]: 那个"他"看着他，模糊的脸上似乎浮现出一丝笑意。
            - paragraph [ref=f1e479]:
              - strong [ref=f1e480]: "\"没关系。\""
              - text: 他说，把手里的蜡烛往前递了递，
              - strong [ref=f1e481]: "\"蜡烛会帮你想起来的。\""
            - paragraph [ref=f1e482]:
              - strong [ref=f1e483]: "\"你只需要点着它。\""
            - paragraph [ref=f1e484]:
              - emphasis [ref=f1e485]: （持续更新，下一章预告：林秋接过蜡烛——火柴盒里只剩两根火柴。）
        - article [ref=f1e486]:
          - heading "林秋跟随第二个自己走进储物间后的暗门先在" [level=2] [ref=f1e487]
          - button "本章要点提纲（点击展开）" [ref=f1e489]:
            - generic [aria-hidden] [ref=f1e490]: 📋
            - text: 本章要点提纲（点击展开）
          - generic [ref=f1e491]:
            - list [ref=f1e492]:
              - listitem [ref=f1e493]: 火柴盒里只剩两根火柴
              - listitem [ref=f1e494]: 火柴盒背面写着："每一根可以打开一扇门"
              - listitem [ref=f1e495]: 重点："你只有一次点火的机会"
            - list [ref=f1e496]:
              - listitem [ref=f1e497]:
                - strong [ref=f1e498]: 章末钩子
                - list [ref=f1e499]:
                  - listitem [ref=f1e500]: 两人站在第七层门前
                  - listitem [ref=f1e501]: 第二个林秋说："这扇门后面不是答案。你想清楚再开。"
                  - listitem [ref=f1e502]: 门内传来林秋自己的声音，反复说着同一句话——是"第三个林秋"
            - separator [ref=f1e503]
            - heading "正文" [level=2] [ref=f1e504]
            - paragraph [ref=f1e505]: 第二个林秋走在他前面。
            - paragraph [ref=f1e506]: 他举着那根未点燃的蜡烛，烛芯在空气里轻轻颤抖，像一只正在探路的触角。便利店的日光灯管在他身后越来越远，光线被货架切割成一条条细长的白带。
            - paragraph [ref=f1e507]: 他们穿过第七排货架，穿过原本不存在的过道，穿过林秋七个小时值班从未注意到的最里面那面墙——
            - paragraph [ref=f1e508]: 那里本该是仓库的卷帘门。
            - paragraph [ref=f1e509]: 但现在，卷帘门消失了。取而代之的是一扇老旧的木门，漆皮剥落，露出下面灰白色的木纹。门上没有把手，只有一个黄铜钥匙孔，锁眼里透出一点点微弱的橘红色光。
            - paragraph [ref=f1e510]: "\"这里……\"林秋的声音有些发干，\"我在这里上了两年班。\""
            - paragraph [ref=f1e511]: "\"嗯。\"第二个林秋没有回头，\"我也是。\""
            - paragraph [ref=f1e512]: 他把蜡烛举高了一点，烛光照亮木门的下半部分。林秋这才看见——
            - paragraph [ref=f1e513]: 门板的下缘，有一行用黑色记号笔写的字。字迹歪歪扭扭，笔画的末端都往上挑，像是写字的人手在抖：
            - paragraph [ref=f1e514]:
              - strong [ref=f1e515]: "\"第七次。别忘了带火。\""
            - paragraph [ref=f1e516]: 第二个林秋的脚步顿了顿。
            - paragraph [ref=f1e517]: "\"……第七次。\"他重复了一遍，声音很轻，像是在确认一个让他自己也害怕的数字。然后他继续往前走，\"走吧。\""
            - paragraph [ref=f1e518]: 他没有推门。他蹲下身，把手按在门板底部的踢脚线上，往上一推。
            - paragraph [ref=f1e519]: 木门没有动。
            - paragraph [ref=f1e520]: 但踢脚线的下方，露出一个黑洞洞的方形开口——一块原本嵌在木门底部的铁板被推了进去，露出一段向下的楼梯。
            - paragraph [ref=f1e521]: 林秋看着那个黑黝黝的洞口，胃里泛起一阵恶心。
            - paragraph [ref=f1e522]: "\"这是哪儿？\""
            - paragraph [ref=f1e523]: "\"储物间。\"第二个林秋说，\"你以前从来没进来过。\""
            - paragraph [ref=f1e524]: "\"我以前也没注意过这里有门。\""
            - paragraph [ref=f1e525]: "\"嗯。\"第二个林秋往下走了第一级台阶，铁扶手在他手心里发出一声闷响，\"因为它只在特定时间打开。\""
            - paragraph [ref=f1e526]: "\"什么时间？\""
            - paragraph [ref=f1e527]: "\"03:17。\""
            - paragraph [ref=f1e528]: 他没有再解释。他开始往下走。
            - paragraph [ref=f1e529]: 林秋犹豫了一秒，跨过洞口边缘。
            - paragraph [ref=f1e530]: 楼梯比想象中更窄。每一级台阶都只够一个人通过，两个人前后脚走，前面的人呼出的气会扑到后面人的脸上。第二个林秋身上的气味很淡——是便利店仓库里那种纸板箱和过期饮料混合的味道，混着一丝若有若无的塑料燃烧味。
            - paragraph [ref=f1e531]: 他闻了闻自己身上。
            - paragraph [ref=f1e532]: 同样的味道。
            - paragraph [ref=f1e533]: 第一层楼梯到底。铁扶手在这里拐了个弯，继续往下。墙上的白漆已经开始剥落，露出下面灰黑色的水泥。潮湿的墙皮散发出一种地下室的霉味，但这种霉味不像是长年累月形成的——更像是刚生成几天的。
            - paragraph [ref=f1e534]: 林秋的手指划过墙面。
            - paragraph [ref=f1e535]: 墙皮是潮的。
            - paragraph [ref=f1e536]: "\"第一层。\"第二个林秋在前面低声说。"
            - paragraph [ref=f1e537]: 林秋这才注意到——墙壁上，用什么尖锐的东西，刻着一个数字。
            - paragraph [ref=f1e538]:
              - strong [ref=f1e539]: 1。
            - paragraph [ref=f1e540]: 笔画很浅，刻痕很新，边缘还带着白色的粉尘。是用钥匙、或者指甲刻出来的。
            - paragraph [ref=f1e541]: 林秋盯着那个数字："这是谁刻的？"
            - paragraph [ref=f1e542]: 第二个林秋没有回答。
            - paragraph [ref=f1e543]: 他继续往下走。
            - paragraph [ref=f1e544]: 第二层。
            - paragraph [ref=f1e545]:
              - text: 墙上的数字是
              - strong [ref=f1e546]: "2"
              - text: 。刻痕比第一层深一点，边缘的粉尘少了，像是刻了很久才被人发现。
            - paragraph [ref=f1e547]: 第三层。
            - paragraph [ref=f1e548]:
              - strong [ref=f1e549]: "3"
              - text: 。刻痕更深了。刻痕里有几道横向的划痕，像是在刻这个数字的时候，刻的人手在剧烈地抖。
            - paragraph [ref=f1e550]: 第四层。
            - paragraph [ref=f1e551]:
              - strong [ref=f1e552]: "4"
              - text: 。数字旁边多了几个字。林秋凑近去看——是圆珠笔写的，字迹和便利店小票上的一模一样：
            - paragraph [ref=f1e553]:
              - strong [ref=f1e554]: "\"还剩三根。我在第三排。\""
            - paragraph [ref=f1e555]: 第五层。
            - paragraph [ref=f1e556]:
              - strong [ref=f1e557]: "5"
              - text: 。没有字。但刻这个数字的人显然用了非常大的力气——刻痕深得能伸进去一根手指。数字的右下角还残留着一点干涸的、暗红色的东西。
            - paragraph [ref=f1e558]: 林秋没敢细看。
            - paragraph [ref=f1e559]: 第六层。
            - paragraph [ref=f1e560]:
              - strong [ref=f1e561]: "6"
              - text: 。刻痕是用指甲抠出来的。林秋能看到墙皮上一片一片的剥落，像是被什么野兽挠过。数字"6"的最后一笔拖得很长，延伸出去将近半米，消失在墙角的阴影里。
            - paragraph [ref=f1e562]: 而在这条刻痕的尽头，用血——或者是和血很像的东西——写着两个极小的字：
            - paragraph [ref=f1e563]:
              - strong [ref=f1e564]: "\"救我。\""
            - paragraph [ref=f1e565]: 林秋停下脚步。
            - paragraph [ref=f1e566]: 他的腿在发抖。
            - paragraph [ref=f1e567]: "\"……那是谁？\""
            - paragraph [ref=f1e568]: 第二个林秋站在第六层和第七层之间的拐角处，背对着他。蜡烛的光把他工服上的褶皱照得发白。
            - paragraph [ref=f1e569]: "\"都是你。\"他说。声音很平，像在陈述一个事实，\"每一层，都是你在某一轮的痕迹。\""
            - paragraph [ref=f1e570]: "\"轮？\""
            - paragraph [ref=f1e571]: "\"七轮。\"他终于转过身来。林秋看不清他的表情，但他的声音里有种说不清的东西——不是恐惧，是比恐惧更深的东西，\"便利店会在每天凌晨03:17打开这扇门。你会进来。你会走下楼梯。你会在第七层之前点着蜡烛。\""
            - paragraph [ref=f1e572]: "\"然后？\""
            - paragraph [ref=f1e573]: "\"然后你会进入下一轮。\"第二个林秋顿了顿，\"或者说——你会进入'下一次轮'里的'下一次'。\""
            - paragraph [ref=f1e574]: "\"……什么意思？\""
            - paragraph [ref=f1e575]: "\"意思是，你每次走下来，都会以为自己'终于搞清楚了'。但你没有。每次你都只差一步。每次你都只走到第六层就停。\""
            - paragraph [ref=f1e576]: "\"为什么？\""
            - paragraph [ref=f1e577]: "\"因为你怕。\""
            - paragraph [ref=f1e578]: 第二个林秋的模糊面孔在烛光里轻轻晃动了一下。
            - paragraph [ref=f1e579]: "\"你怕的不是门后面的东西。你怕的是——\""
            - paragraph [ref=f1e580]: 他没有说下去。
            - paragraph [ref=f1e581]: 他只是把蜡烛往林秋手里递了递。
            - paragraph [ref=f1e582]: "\"拿着。\""
            - paragraph [ref=f1e583]: 林秋接过蜡烛。蜡烛的触感很怪——不是蜡制的触感，更像是一根骨头，干燥、冰冷，但隐约透出一点温度。烛芯不是棉线，是一缕极细的、灰白色的头发。
            - paragraph [ref=f1e584]: "\"火柴盒。\"第二个林秋从工服口袋里掏出一个纸盒，递给他，\"你只有两根火柴。每根可以打开一扇门。\""
            - paragraph [ref=f1e585]: "\"门？\""
            - paragraph [ref=f1e586]: "\"第七层的门。\"第二个林秋用手指了指下方，\"这一轮，你必须走到底。\""
            - paragraph [ref=f1e587]: "\"然后呢？门后面是什么？\""
            - paragraph [ref=f1e588]: 第二个林秋没有立刻回答。
            - paragraph [ref=f1e589]: 他低头看着自己空着的手，沉默了三秒。
            - paragraph [ref=f1e590]: "\"我不知道。\"他说，\"我走到过第六层。每次都走到第六层。然后我就……\""
            - paragraph [ref=f1e591]: "\"就什么？\""
            - paragraph [ref=f1e592]: "\"就忘了我为什么要走下去。\""
            - paragraph [ref=f1e593]: 楼梯间的空气冷得发颤。
            - paragraph [ref=f1e594]: 林秋把火柴盒握在手里。纸盒很轻，但他的手指在发抖，盒角在指缝间一颤一颤的。他翻过火柴盒，看到背面用圆珠笔写着两行字：
            - paragraph [ref=f1e595]:
              - strong [ref=f1e596]: "\"一根开门。一根照路。\""
              - strong [ref=f1e597]: "\"你只有一次机会。\""
            - paragraph [ref=f1e598]: 第七层的门就在下面。
            - paragraph [ref=f1e599]: 隔着最后几级台阶，林秋能听到门那边传来的声音。极轻的，断断续续的。
            - paragraph [ref=f1e600]: 是人在说话。
            - paragraph [ref=f1e601]: 而且是两个人。
            - paragraph [ref=f1e602]: 两个一模一样的声音在重复着同一句话：
            - paragraph [ref=f1e603]:
              - strong [ref=f1e604]: "\"我……我要……我必须……我……\""
            - paragraph [ref=f1e605]: 第二个林秋突然伸手，按住了林秋的肩膀。
            - paragraph [ref=f1e606]: "\"这扇门后面不是答案。\"他说，声音比之前更轻，\"是问题。\""
            - paragraph [ref=f1e607]: "\"什么问题？\""
            - paragraph [ref=f1e608]: "\"——你愿不愿意成为下一个'我'的问题。\""
            - paragraph [ref=f1e609]: 他松开了手。
            - paragraph [ref=f1e610]: "\"想清楚再开。\""
            - paragraph [ref=f1e611]:
              - emphasis [ref=f1e612]: （持续更新，下一章预告：林秋点燃火柴——门后是第七个林秋，正在用手指抠墙。）
        - article [ref=f1e613]:
          - heading "真相揭露：两个林秋必须只留下一个先在 <" [level=2] [ref=f1e614]
          - button "本章要点提纲（点击展开）" [ref=f1e616]:
            - generic [aria-hidden] [ref=f1e617]: 📋
            - text: 本章要点提纲（点击展开）
          - generic [ref=f1e618]:
            - list [ref=f1e619]:
              - listitem [ref=f1e620]: 这不是怪物故事，是关于"被困在循环里的人如何让下一个人少走弯路"
            - list [ref=f1e621]:
              - listitem [ref=f1e622]:
                - strong [ref=f1e623]: 章末钩子
                - list [ref=f1e624]:
                  - listitem [ref=f1e625]: 林秋点燃两根火柴
                  - listitem [ref=f1e626]: 门后那个"第七个自己"笑了——他终于等到了
                  - listitem [ref=f1e627]: 墙上所有刻痕同时消失，便利店恢复原样
                  - listitem [ref=f1e628]: 但林秋走出店门时，看到一个年轻人正推开员工通道的门——那是明天的他
            - separator [ref=f1e629]
            - heading "正文" [level=2] [ref=f1e630]
            - paragraph [ref=f1e631]: 第七层的门比想象中更小。
            - paragraph [ref=f1e632]: 是那种老式仓库的防火门，铁皮包边，中间嵌着一个圆形的观察窗。观察窗的玻璃很脏，从外面只能看到模糊的色块。但林秋能看到色块在动。
            - paragraph [ref=f1e633]: 里面有人。
            - paragraph [ref=f1e634]: 第二个林秋蹲在门边，从工服内袋里掏出一把极小的钥匙。钥匙是黑色的，像是塑料，但摸上去有金属的冰凉感。他把钥匙插进锁眼，轻轻一转。
            - paragraph [ref=f1e635]: "\"咔。\""
            - paragraph [ref=f1e636]: 观察窗后，那个模糊的色块猛地往后退了一步。
            - paragraph [ref=f1e637]: 然后贴了上来。
            - paragraph [ref=f1e638]: 林秋终于看清了门后那个人的脸。
            - paragraph [ref=f1e639]: 是他的脸。
            - paragraph [ref=f1e640]: 但比他现在的脸老了至少十年。皮肤松弛，眼窝深陷，眼白发黄。嘴唇干裂，裂口里渗着暗红色的血痂。他的工服已经看不出原来的颜色，沾满了灰白色的粉尘和暗红色的污渍。
            - paragraph [ref=f1e641]: 他赤着脚。十根脚趾的指甲全没了，露出下面鲜红的肉。
            - paragraph [ref=f1e642]: 而他的手——
            - paragraph [ref=f1e643]: 他正在用手指抠墙。
            - paragraph [ref=f1e644]: 十根手指的指甲盖都掀翻了，露出下面粉红色的甲床。指节弯曲的角度已经超出了人体极限，像十根被强行折断的树枝。他的指尖在墙皮上机械地刮动着，每一下都带下来一片灰白色的碎屑。
            - paragraph [ref=f1e645]: 墙上有字。
            - paragraph [ref=f1e646]: 很多字。密密麻麻的，挤满了整个墙面。都是用血写的——林秋能闻到那股铁锈味，浓烈得让他胃里翻涌。
            - paragraph [ref=f1e647]: 最上方一行字最大，写着：
            - paragraph [ref=f1e648]:
              - strong [ref=f1e649]: "\"第七轮。我到了。\""
            - paragraph [ref=f1e650]: 下面一行稍小：
            - paragraph [ref=f1e651]:
              - strong [ref=f1e652]: "\"还剩一根。\""
            - paragraph [ref=f1e653]: 再下面，开始记录他进入这间房间后发生的事。字迹从清晰变得潦草，从潦草变得颤抖，从颤抖变得几乎无法辨认。林秋能看懂的部分断断续续：
            - paragraph [ref=f1e654]:
              - strong [ref=f1e655]: "\"……他们让我选择……\""
              - strong [ref=f1e656]: "\"……我选了七次……\""
              - strong [ref=f1e657]: "\"……每次都以为这次能出去……\""
              - strong [ref=f1e658]: "\"……第七个我已经死了……不，是我……\""
              - strong [ref=f1e659]: "\"……火柴盒里有两根火柴……\""
              - strong [ref=f1e660]: "\"……两根一起点……两根一起……\""
              - strong [ref=f1e661]: "\"……必须同时……\""
              - strong [ref=f1e662]: "\"……\""
            - paragraph [ref=f1e663]: 最后一行的字已经不像字了，是某种符号的涂鸦，像一个溺水的人在抓最后一根稻草。
            - paragraph [ref=f1e664]: 第七个林秋的手指停了下来。
            - paragraph [ref=f1e665]: 他转过头，看向门外的两个自己。
            - paragraph [ref=f1e666]: 他的嘴唇动了动。声音像是从很远的地方传来，干涩、破碎：
            - paragraph [ref=f1e667]: "\"……第六个？\""
            - paragraph [ref=f1e668]: "\"是。\"第二个林秋蹲在门边，声音很平，\"第六个。\""
            - paragraph [ref=f1e669]: "\"……他呢？\"第七个林秋的眼睛越过第二个林秋，落在林秋身上，\"第五个？\""
            - paragraph [ref=f1e670]: "\"不是。\"第二个林秋说，\"他没来过。\""
            - paragraph [ref=f1e671]: 第七个林秋的眼睛亮了一下。那种亮不是希望，是更复杂的东西——像是一个守夜人终于看到了接班人。
            - paragraph [ref=f1e672]: "\"……第一轮。\""
            - paragraph [ref=f1e673]: "\"第一轮。\"第二个林秋说。"
            - paragraph [ref=f1e674]: 第七个林秋突然笑了。
            - paragraph [ref=f1e675]: 那是一种很轻的笑，嘴角只微微上扬了一点，但整个人的状态都变了。他抠墙的手指终于松了下来，十根手指垂在身侧，血从指尖滴落在地砖上。
            - paragraph [ref=f1e676]: "\"……你还没明白。\"他对林秋说，声音比之前清晰了一点，\"对吧？\""
            - paragraph [ref=f1e677]: 林秋张了张嘴。
            - paragraph [ref=f1e678]: "\"明白什么？\""
            - paragraph [ref=f1e679]: "\"我们是谁。\"第七个林秋慢慢地从墙边站起来。他的腿在抖，但他还是站直了，\"你以为楼梯上的刻痕是'我'留下的？\""
            - paragraph [ref=f1e680]: "\"……不是吗？\""
            - paragraph [ref=f1e681]: "\"是。\""
            - paragraph [ref=f1e682]: "\"那你说什么——\""
            - paragraph [ref=f1e683]: "\"但不是同一个人留下的。\""
            - paragraph [ref=f1e684]: 第七个林秋拖着腿走到门边。他比门外的两个林秋都矮一点——他一直蹲着，脊椎已经压弯了。他抬起手，贴在观察窗的玻璃上。玻璃上映出三个一模一样的轮廓。
            - paragraph [ref=f1e685]: "\"每一轮，会有一个新的'我'进入便利店。\"他说，\"我会在03:17醒来。我会看到小票。我会数到'还剩七根'。我会走下来。\""
            - paragraph [ref=f1e686]: "\"然后呢？\""
            - paragraph [ref=f1e687]: "\"然后我会遇到上一个'我'。\"他指了指门外的第二个林秋，\"然后那个'我'会陪我下来。我们会一起走到第七层。我们会看到这扇门。\""
            - paragraph [ref=f1e688]: "\"我们会打开。\""
            - paragraph [ref=f1e689]: "\"我们会看到'我'。\""
            - paragraph [ref=f1e690]: "\"——然后我们之中的一个，会变成这扇门后面的'我'。\""
            - paragraph [ref=f1e691]: 林秋的脑子里一片空白。
            - paragraph [ref=f1e692]: "\"……什么？\""
            - paragraph [ref=f1e693]: "\"两个只能留一个。\"第七个林秋说得很轻，像在说一个讲过无数遍的故事，\"另一个必须留下来。留下来的人，会成为下一轮门后的人。\""
            - paragraph [ref=f1e694]: "\"而下一轮，又会有两个新的'我'下来。\""
            - paragraph [ref=f1e695]: "\"循环。\""
            - paragraph [ref=f1e696]: 林秋的腿软了一下，他扶住门框才没倒下去。
            - paragraph [ref=f1e697]: "\"……所以他们——\"他看向第二个林秋，\"他回来，是为了……\""
            - paragraph [ref=f1e698]: "\"是为了接替我。\"第二个林秋说。"
            - paragraph [ref=f1e699]: 他转过身，看着林秋。
            - paragraph [ref=f1e700]: 林秋终于看清了他的脸。
            - paragraph [ref=f1e701]: 不是模糊的。是清晰的。和林秋一模一样的脸。眼角没有第七个的皱纹，但有林秋没有的疲惫——一种经历过什么又活下来的疲惫。
            - paragraph [ref=f1e702]: "\"我已经经历过六轮了。\"他说，\"每一轮，我都接替了上一个'我'。每一轮，我都往下沉一层。\""
            - paragraph [ref=f1e703]: "\"那你为什么还活着？\""
            - paragraph [ref=f1e704]: "\"因为每一轮，都会有新的'我'进来。\"第二个林秋说，\"新进来的'我'不知道自己是谁。'我'会告诉'我'该怎么做。'我'会带'我'下来。\""
            - paragraph [ref=f1e705]: "\"然后'我'中的一个人，会成为新的'我'。\""
            - paragraph [ref=f1e706]: "\"——这就是为什么，我们只能活一个。\""
            - paragraph [ref=f1e707]: 林秋感觉自己的呼吸在一点一点变慢。
            - paragraph [ref=f1e708]: "\"……你为什么不早点告诉我？\""
            - paragraph [ref=f1e709]: "\"因为没用。\"第二个林秋说，\"你知道得再多，也改变不了结局。你只会害怕。害怕了，你就会停。停了，你就会变成下一个'刻痕'。\""
            - paragraph [ref=f1e710]: "\"但你不会真的停。\"第七个林秋在门后说，\"你只能往下走。因为不走，你就会变成小票上的数字。\""
            - paragraph [ref=f1e711]: "\"会变成'还剩零根'。\""
            - paragraph [ref=f1e712]: 林秋低下头。
            - paragraph [ref=f1e713]: 他看着手里的火柴盒。盒子里只有两根火柴。火柴头上沾着红色的磷，在昏暗的灯光下像两只眼睛。
            - paragraph [ref=f1e714]: "\"……两根一起点。\"他说，\"墙上写的。\""
            - paragraph [ref=f1e715]: "\"对。\"第七个林秋说。"
            - paragraph [ref=f1e716]: "\"两根火柴必须同时燃烧。\""
            - paragraph [ref=f1e717]: "\"对。\""
            - paragraph [ref=f1e718]: "\"燃烧之后，会怎么样？\""
            - paragraph [ref=f1e719]: 第七个林秋没有回答。
            - paragraph [ref=f1e720]: 他看向第二个林秋。
            - paragraph [ref=f1e721]: 第二个林秋也没有回答。
            - paragraph [ref=f1e722]: 林秋抬起头，看着他们两个。两个一样的脸。一个在门里，一个在门外。一个老，一个年轻。但他们看林秋的眼神是一样的。
            - paragraph [ref=f1e723]: 是送别的眼神。
            - paragraph [ref=f1e724]: "\"……是我。\"林秋说。"
            - paragraph [ref=f1e725]: 两个林秋都没有说话。
            - paragraph [ref=f1e726]: "\"是你们之中的一个，会消失。\""
            - paragraph [ref=f1e727]: "\"对。\"第二个林秋说。"
            - paragraph [ref=f1e728]: "\"而活下来的那个——\""
            - paragraph [ref=f1e729]: "\"活下来的那个，会成为下一个守夜人。\"第七个林秋说，\"会等着下一个'我'进来。会告诉他真相。会陪他下来。会——\""
            - paragraph [ref=f1e730]: "\"会成为下一个'你'。\"林秋说。"
            - paragraph [ref=f1e731]: "\"对。\""
            - paragraph [ref=f1e732]: 林秋低下头，看着火柴盒。
            - paragraph [ref=f1e733]:
              - text: 盒子的背面写着：
              - strong [ref=f1e734]: "\"一根开门。一根照路。你只有一次机会。\""
            - paragraph [ref=f1e735]: "\"……为什么是两根火柴？\""
            - paragraph [ref=f1e736]: "\"因为门要打开，路要照亮。\"第七个林秋说，\"如果你只点一根——\""
            - paragraph [ref=f1e737]: "\"你会永远困在这里。\"第二个林秋说，\"永远。\""
            - paragraph [ref=f1e738]: 林秋把火柴盒握紧。
            - paragraph [ref=f1e739]: 纸盒的边缘割进他的掌心。但他没有松手。
            - paragraph [ref=f1e740]: "\"……如果我点两根呢？\""
            - paragraph [ref=f1e741]: "\"两根一起点。\""
            - paragraph [ref=f1e742]: "\"门会打开。路会被照亮。\""
            - paragraph [ref=f1e743]: "\"然后——\""
            - paragraph [ref=f1e744]: "\"然后门会关上。\"第七个林秋说，\"门关上的时候，门里的人会消失。\""
            - paragraph [ref=f1e745]: "\"门里的人？\"林秋看向他，\"是你？\""
            - paragraph [ref=f1e746]: "\"是我。\""
            - paragraph [ref=f1e747]: "\"……为什么是你？\""
            - paragraph [ref=f1e748]: "\"因为我是第七个。\"第七个林秋笑了。那种笑和之前不一样了——之前的笑是苦笑，现在的笑是真的笑。是解脱的笑。"
            - paragraph [ref=f1e749]: "\"我在这里待了太久。\""
            - paragraph [ref=f1e750]: "\"我已经——\""
            - paragraph [ref=f1e751]: 他抬起手，看着自己血肉模糊的十根手指。
            - paragraph [ref=f1e752]: "\"我已经等了很久。\""
            - paragraph [ref=f1e753]: 林秋的眼睛开始发酸。
            - paragraph [ref=f1e754]: "\"……我不认识你。\""
            - paragraph [ref=f1e755]: "\"你不需要认识我。\"第七个林秋说，\"你只需要知道——\""
            - paragraph [ref=f1e756]: "\"你点着火柴之后，第六层墙上的字会变。\""
            - paragraph [ref=f1e757]: "\"变成'还剩六根'。\""
            - paragraph [ref=f1e758]: "\"——然后你会成为下一个守夜人。\""
            - paragraph [ref=f1e759]: "\"而下一个'我'进来的时候——\""
            - paragraph [ref=f1e760]: "\"——你会像我一样，等在这里。\""
            - paragraph [ref=f1e761]: 林秋站在那里，没有动。
            - paragraph [ref=f1e762]: 他看着门后那个血肉模糊的自己。看着门边那个准备接替自己的自己。
            - paragraph [ref=f1e763]: 他突然明白了。
            - paragraph [ref=f1e764]: 这不是怪物故事。
            - paragraph [ref=f1e765]: 这是一个关于"被困在循环里的人如何让下一个人少走弯路"的故事。
            - paragraph [ref=f1e766]: 他深吸了一口气。
            - paragraph [ref=f1e767]: "\"……火柴。\""
            - paragraph [ref=f1e768]: "\"给你。\"第二个林秋把火柴盒递到他手里。"
            - paragraph [ref=f1e769]: 林秋打开盒子。
            - paragraph [ref=f1e770]: 两根火柴并排躺在里面。红色的磷头，黑色的木杆。
            - paragraph [ref=f1e771]: 他拿起一根。
            - paragraph [ref=f1e772]: 又拿起一根。
            - paragraph [ref=f1e773]: 火柴在指间轻轻颤抖。
            - paragraph [ref=f1e774]: "\"……一起点？\""
            - paragraph [ref=f1e775]: "\"一起点。\"两个林秋同时说。"
            - paragraph [ref=f1e776]: 林秋把两根火柴的头靠在一起。
            - paragraph [ref=f1e777]: 他划亮了第一根。
            - paragraph [ref=f1e778]: 火焰"噗"的一声燃起来。橘红色的光映在他脸上，映在两个林秋的脸上。
            - paragraph [ref=f1e779]: 他把第二根凑近第一根的火焰。
            - paragraph [ref=f1e780]: 两根火柴同时燃烧。
            - paragraph [ref=f1e781]: 火焰比单根的时候亮。亮得刺眼。亮得整个楼梯间都变成了白色。
            - paragraph [ref=f1e782]: 林秋听到了一声叹息。
            - paragraph [ref=f1e783]: 很轻。
            - paragraph [ref=f1e784]: 是第七个林秋的声音。
            - paragraph [ref=f1e785]: 然后那声叹息消失了。
            - paragraph [ref=f1e786]: 第七层的门缓缓打开。
            - paragraph [ref=f1e787]: 门后是空的。
            - paragraph [ref=f1e788]: 墙上的血字消失了。地板上的血迹消失了。所有的痕迹都消失了。只有一面干干净净的墙，墙上刻着一个数字：
            - paragraph [ref=f1e789]:
              - strong [ref=f1e790]: 6。
            - paragraph [ref=f1e791]: 林秋的腿软了一下，他跪倒在地上。
            - paragraph [ref=f1e792]: 火柴已经燃尽了。灰烬从他的指缝间飘落，落在地砖上。
            - paragraph [ref=f1e793]: 他听到身后有脚步声。
            - paragraph [ref=f1e794]: 第二个林秋蹲在他身边。
            - paragraph [ref=f1e795]: "\"……谢谢。\""
            - paragraph [ref=f1e796]: 林秋没有回答。
            - paragraph [ref=f1e797]: 他只是看着墙上那个数字。
            - paragraph [ref=f1e798]:
              - strong [ref=f1e799]: 6。
            - paragraph [ref=f1e800]: "\"……你从零开始。\""
            - paragraph [ref=f1e801]: "\"我知道。\""
            - paragraph [ref=f1e802]: "\"你会忘记今晚。\""
            - paragraph [ref=f1e803]: "\"我知道。\""
            - paragraph [ref=f1e804]: "\"你会忘记我。\""
            - paragraph [ref=f1e805]: "\"……\"林秋抬起头，看着第二个林秋，\"我会吗？\""
            - paragraph [ref=f1e806]: "\"会。\"第二个林秋说，\"每一轮都会忘。\""
            - paragraph [ref=f1e807]: "\"那你——\""
            - paragraph [ref=f1e808]: "\"我会记得。\"第二个林秋说，\"我会记得你。\""
            - paragraph [ref=f1e809]: "\"我会替你记着。\""
            - paragraph [ref=f1e810]: 林秋的眼睛终于湿了。
            - paragraph [ref=f1e811]: 他不知道为什么哭。他不认识这个人。这个人是他自己。但他不认识。
            - paragraph [ref=f1e812]: "\"……下一轮。\""
            - paragraph [ref=f1e813]: "\"下一轮。\"第二个林秋点了点头，\"下一轮，新的'你'会进来。\""
            - paragraph [ref=f1e814]: "\"我会告诉他真相。\""
            - paragraph [ref=f1e815]: "\"我会陪他下来。\""
            - paragraph [ref=f1e816]: "\"我会——\""
            - paragraph [ref=f1e817]: "\"——你会成为下一个'你'。\""
            - paragraph [ref=f1e818]: 第二个林秋笑了。
            - paragraph [ref=f1e819]: "\"对。\""
            - paragraph [ref=f1e820]: 林秋站起来。
            - paragraph [ref=f1e821]: 他往楼梯上走。
            - paragraph [ref=f1e822]: 身后传来第二个林秋的声音：
            - paragraph [ref=f1e823]: "\"——等一下。\""
            - paragraph [ref=f1e824]: 林秋停下脚步。
            - paragraph [ref=f1e825]: "\"……还有一根蜡烛。\""
            - paragraph [ref=f1e826]: 林秋回过头。
            - paragraph [ref=f1e827]: 第二个林秋站在第六层和第七层之间的拐角处，手里举着一根白色的蜡烛。
            - paragraph [ref=f1e828]: "\"还剩六根。\"他说，\"你带走第一根。\""
            - paragraph [ref=f1e829]: "\"剩下的五根——\""
            - paragraph [ref=f1e830]: "\"——留给下一轮的你。\""
            - paragraph [ref=f1e831]: 林秋接过蜡烛。
            - paragraph [ref=f1e832]: 蜡烛的触感很怪。干燥、冰冷。但烛芯那缕灰白色的头发，在昏暗的灯光下像一只眼睛。
            - paragraph [ref=f1e833]: "\"……再见。\"林秋说。"
            - paragraph [ref=f1e834]: "\"再见。\"第二个林秋说。"
            - paragraph [ref=f1e835]: 林秋转身往楼梯上走。
            - paragraph [ref=f1e836]: 他一步一步往上走。铁扶手在他手心里发出沉闷的回响。墙上的刻痕在他的指尖下一一划过——
            - paragraph [ref=f1e837]:
              - strong [ref=f1e838]: 5。
            - paragraph [ref=f1e839]:
              - strong [ref=f1e840]: 4。
            - paragraph [ref=f1e841]:
              - strong [ref=f1e842]: 3。
            - paragraph [ref=f1e843]:
              - strong [ref=f1e844]: 2。
            - paragraph [ref=f1e845]:
              - strong [ref=f1e846]: 1。
            - paragraph [ref=f1e847]: 他走出储物间。
            - paragraph [ref=f1e848]: 便利店和他下去之前一样。日光灯在头顶嗡嗡作响。冰柜发出均匀的嗡鸣。玻璃门外是凌晨的街道，路灯把梧桐树影切成一地碎纸。
            - paragraph [ref=f1e849]: 他走到收银台后面，坐下来。
            - paragraph [ref=f1e850]: 他看着台面边缘那张小票。
            - paragraph [ref=f1e851]:
              - strong [ref=f1e852]: 还剩六根。
            - paragraph [ref=f1e853]: 他伸手把小票拿起来。
            - paragraph [ref=f1e854]: 翻到背面。
            - paragraph [ref=f1e855]: 手写的字迹在灯光下轻轻晃动：
            - paragraph [ref=f1e856]:
              - strong [ref=f1e857]: "\"谢谢你。\""
            - paragraph [ref=f1e858]: 林秋把小票折好，放进胸口的口袋里。
            - paragraph [ref=f1e859]: 他拿起蜡烛。走到便利店最深处的第七排货架。那里有一个矿泉水箱，箱子的缝隙里——
            - paragraph [ref=f1e860]: 他不知道该怎么做。
            - paragraph [ref=f1e861]: 但他的手已经动了。
            - paragraph [ref=f1e862]: 他把蜡烛插进缝隙里。
            - paragraph [ref=f1e863]: 蜡烛没有点燃。但它开始自己燃烧。
            - paragraph [ref=f1e864]: 火焰从烛芯里跳出来，橘红色的，微弱的，一明一灭。
            - paragraph [ref=f1e865]: 林秋看着那点光。
            - paragraph [ref=f1e866]: 然后他听到了脚步声。
            - paragraph [ref=f1e867]: 从便利店门外传来。
            - paragraph [ref=f1e868]: 有人正在推开玻璃门。
            - paragraph [ref=f1e869]: 门上的风铃发出一声轻响。
            - paragraph [ref=f1e870]: 林秋抬起头。
            - paragraph [ref=f1e871]:
              - text: 一个穿着便利店工服的年轻人站在门口。胸口别着工牌。工牌上写着：
              - strong [ref=f1e872]: 林秋
              - text: 。
            - paragraph [ref=f1e873]: 他看起来很年轻。看起来很累。看起来——
            - paragraph [ref=f1e874]: ——刚从员工通道进来。
            - paragraph [ref=f1e875]: 年轻人的眼睛扫过空荡荡的便利店，落在收银台后面坐着的林秋身上。
            - paragraph [ref=f1e876]: "\"……你好。\"年轻人说，\"我是新来的。\""
            - paragraph [ref=f1e877]: 林秋看着他。
            - paragraph [ref=f1e878]: 他突然想哭。
            - paragraph [ref=f1e879]: 但他没有哭。
            - paragraph [ref=f1e880]: 他只是点了点头：
            - paragraph [ref=f1e881]: "\"欢迎。\""
            - paragraph [ref=f1e882]: "\"——我叫林秋。\""
            - paragraph [ref=f1e883]:
              - emphasis [ref=f1e884]: （全文完）
            - separator [ref=f1e885]
            - paragraph [ref=f1e886]:
              - strong [ref=f1e887]: 【创作后记】
            - paragraph [ref=f1e888]: 这是一个关于"被困在循环里的人"的故事。
            - paragraph [ref=f1e889]:
              - text: 他没有怪物，没有反派，没有具体的恶。他只有一个问题：
              - strong [ref=f1e890]: 如何让下一个人少走弯路。
            - paragraph [ref=f1e891]: 答案藏在七根蜡烛里。每一根蜡烛燃尽，就会有一个新的"我"醒来。他会看到小票，会数到"还剩七根"，会走下楼梯。他会害怕，会犹豫，会在某一层停下来。
            - paragraph [ref=f1e892]: 但只要有人记得他——只要有人愿意成为下一个守夜人——
            - paragraph [ref=f1e893]: ——他就不会真正消失。
            - paragraph [ref=f1e894]: 他会变成下一个"刻痕"。
            - paragraph [ref=f1e895]: 他会变成下一个"救我"。
            - paragraph [ref=f1e896]: 他会变成下一个"谢谢你"。
            - paragraph [ref=f1e897]: 这不是怪物故事。
