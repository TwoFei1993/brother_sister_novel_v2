              - paragraph [ref=f1e59]: 妹妹
              - generic [ref=f1e60]: "\"只要你别在宿舍烧坩埚，我们去哪儿都行。\" 我话音刚落，妹妹就咧开嘴笑起来，露出两颗小虎牙。 \"成交！\" 她一把挽住我的胳膊，拖着我穿过热闹的街道。石板路上铺着薄薄一层落叶，大概是昨晚的风吹下来的。阳光斜斜地打在对面的屋顶上，给那些歪歪斜斜的烟囱镀上一层金边。 \"哥哥你知道吗，\"她边走边说，\"刚才我在车站看到一本书，叫《霍格沃茨：有用的魔法生物大全》，里面说——\" \"等等，你什么时候看的书？\" \"就刚才在车站嘛！\"她理直气壮，\"我就翻了几页而已！\" *我狐疑地看她一眼。这丫头在站台的时候明明一直在吃太妃糖，怎么可能腾出手来看书。* \"那书里说了什么？\" \"说有一种叫'护树罗锅'的小东西，特别特别小，只有手指那么大，但是很凶！\"她比划着，\"它会用树枝打人——\" \"听起来不像是宠物。\" \"可是它也很可爱啊！而且书上说，只要你尊重它，它就会成为你最忠诚的朋友！\" *尊重？我觉得它尊重我的可能性更大一些。* 我们走到街道尽头，一扇老旧的木门上挂着褪色的招牌：**神奇动物园**。 推门进去的瞬间，一股混合着干草、羽毛和某种说不清气味的味道扑面而来。店里光线昏暗，到处堆满了笼子、箱子和玻璃缸。角落里一只巨大的蟾蜍正在打呼噜，呼出的气泡把它的腮帮子撑得鼓鼓的。 \"哇——\" 妹妹发出一声惊叹。 我也愣了一下。 说实话，我来之前想象过魔法动物商店的样子，但没想到会是这样的——简直像把整个神奇动物园都塞进了一间小屋里。 \"小心点，\"我压低声音，\"别乱碰。\" \"知道啦知道啦！\" 她已经蹲到一个玻璃缸前，里面趴着一只火红色的小蜥蜴，背上有一簇小小的火焰在跳动。 \"哥哥你看！这个是'火蜥蜴'，可以当暖炉用！\" \"我觉得我们宿舍不需要第二个暖炉。\" \"可是万一哥哥你半夜写论文手冷呢？\" \"我可以用魔杖点火。\" *她完全没有被说服，眼睛直勾勾盯着那只小蜥蜴。* 我叹了口气，转头观察起店里的其他生物。 一只独角兽幼崽正在角落里吃草，银白色的鬃毛在昏暗的光线里微微发亮。它抬起头看了我一眼，琥珀色的眼睛里倒映着我的影子。 *好漂亮。* \"两位是新来的霍格沃茨学生？\" 一个苍老的声音从柜台后传来。我转头看去，是一个戴着眼镜的老巫师，胡子比头发还白。 \"是的，我们是今年的一年级新生。\"我点点头，\"想先来看看……了解一下魔法生物。\" \"哦，一年级。\"老人推了推眼镜，\"那你们来得正好。昨天刚到一批新货，有些小家伙可能还没完全适应霍格沃茨的天气。\" 他招手让店员过来——一个红头发的小姑娘，围着围裙，看起来比我和妹妹大不了多少。 \"艾米，带他们看看。\" 店员点点头，领着我们往店铺深处走去。 妹妹紧紧跟在我身后，眼睛不断往两侧的笼子里瞟。路过一个箱子时，她突然停下来。 \"哥哥，那个箱子在动。\" 我顺着她的视线看去。 那是一个棕色的木箱，侧面有个小小的铜锁。箱子正在轻轻摇晃，仿佛里面有什么东西在挣扎。 *……我有一种不好的预感。* \"艾米姐姐，\"妹妹开口问，\"这个箱子里是什么呀？\" 店员停下来，看了一眼箱子，露出一个有点为难的表情。 \"这个啊……是'嗅嗅'，一只澳洲产的小家伙。\" \"嗅嗅？\" \"对，它们喜欢闪闪发光的东西。\"店员解释道，\"昨天我们收起来之前，它差点把柜台上的金币全都吞进肚子里。\" 妹妹的眼睛一下子亮了起来。 *完蛋。* \"哥哥——\" \"不行。\" 我还没等她说完就拒绝了。 \"为什么啊！\" \"因为我们才一年级，而且——\"我看了一眼那个还在摇晃的箱子，\"我觉得它会给我们惹很多麻烦。\" 她鼓起脸颊，但没有继续争辩。 我们跟着店员继续往里走，经过了更多稀奇古怪的笼子——有长着蝙蝠翅膀的老鼠，有用鼻音唱歌的植物，还有一只浑身漆黑的猫头鹰正在打盹。 最后，我们来到了店铺的最里面。 \"这是今天的特别推荐。\"店员指着一个玻璃缸说，\"刚到的货，'隐形兽'幼崽。\" 玻璃缸里空无一物。 \"……它在里面吗？\"妹妹疑惑地问。 \"在的。\"店员笑了笑，\"只是你们看不见。\" 我和妹妹面面相觑。 *所以这就是所谓的'看不见'。* 我正准备仔细观察玻璃缸的时候，突然感觉到有什么毛茸茸的东西蹭了蹭我的脚踝。 低头一看—— 一只透明的、毛茸茸的小生物正蹲在我脚边，用它那看不见的眼睛看着我。 \"哥哥！\"妹妹惊呼，\"它找到你了！\" *……我是不是应该感到高兴？* （路过一个货架时，我注意到角落里有一只毛茸茸的、正在啃金币的小东西。我蹲下身仔细一看——* *那只小东西也抬起头，用黑豆般的眼睛看着我。* *\"嗅嗅？\"* *我还没反应过来，它已经一溜烟钻进了货架深处。* *\"哥哥你在看什么？\"妹妹的声音从身后传来。* *\"没什么。\"我站起身，\"走吧，别走散了。\"）* \"成交！\" 她一把挽住我的胳膊，拖着我穿过热闹的街道。石板路上铺着薄薄一层落叶，大概是昨晚的风吹下来的。阳光斜斜地打在对面的屋顶上，给那些歪歪斜斜的烟囱镀上一层金边。 \"哥哥你知道吗，\"她边走边说，\"刚才我在车站看到一本书，叫《霍格沃茨：有用的魔法生物大全》，里面说——\" \"等等，你什么时候看的书？\" \"就刚才在车站嘛！\"她理直气壮，\"我就翻了几页而已！\" *我狐疑地看她一眼。这丫头在站台的时候明明一直在吃太妃糖，怎么可能腾出手来看书。* \"那书里说了什么？\" \"说有一种叫'护树罗锅'的小东西，特别特别小，只有手指那么大，但是很凶！\"她比划着，\"它会用树枝打人——\" \"听起来不像是宠物。\" \"可是它也很可爱啊！而且书上说，只要你尊重它，它就会成为你最忠诚的朋友！\" *尊重？我觉得它尊重我的可能性更大一些。* 我们走到街道尽头，一扇老旧的木门上挂着褪色的招牌：**神奇动物园**。 推门进去的瞬间，一股混合着干草、羽毛和某种说不清气味的味道扑面而来。店里光线昏暗，到处堆满了笼子、箱子和玻璃缸。角落里一只巨大的蟾蜍正在打呼噜，呼出的气泡把它的腮帮子撑得鼓鼓的。 \"哇——\" 妹妹发出一声惊叹。 我也愣了一下。 说实话，我来之前想象过魔法动物商店的样子，但没想到会是这样的——简直把整个神奇动物园都塞进了一间小屋里。 \"小心点，\"我压低声音，\"别乱碰。\" \"知道啦知道啦！\" 她已经蹲到一个玻璃缸前，里面趴着一只火红色的小蜥蜴，背上有一簇小小的火焰在跳动。 \"哥哥你看！这个是'火蜥蜴'，可以当暖炉用！\" \"我觉得我们宿舍不需要第二个暖炉。\" \"可是万一哥哥你半夜写论文手冷呢？\" \"我可以用魔杖点火。\" *她完全没有被说服，眼睛直勾勾盯着那只小蜥蜴。* 我叹了口气，转头观察起店里的其他生物。 一只独角兽幼崽正在角落里吃草，银白色的鬃毛在昏暗的光线里微微发亮。它抬起头看了我一眼，琥珀色的眼睛里倒映着我的影子。 *好漂亮。* \"两位是新来的霍格沃茨学生？\" 一个苍老的声音从柜台后传来。我转头看去，是一个戴着眼镜的老巫师，胡子比头发还白。 \"是的，我们是今年的一年级新生。\"我点点头，\"想先来看看……了解一下魔法生物。\" \"哦，一年级。\"老人推了推眼镜，\"那你们来得正好。昨天刚到一批新货，有些小家伙可能还没完全适应霍格沃茨的天气。\" 他招手让店员过来——一个红头发的小姑娘，围着围裙，看起来比我和妹妹大不了多少。 \"艾米，带他们看看。\" 店员点点头，领着我们往店铺深处走去。 妹妹紧紧跟在我身后，眼睛不断往两侧的笼子里瞟。路过一个箱子时，她突然停下来。 \"哥哥，那个箱子在动。\" 我顺着她的视线看去。 那是一个棕色的木箱，侧面有个小小的铜锁。箱子正在轻轻摇晃，仿佛里面有什么东西在挣扎。 *……我有一种不好的预感。* \"艾米姐姐，\"妹妹开口问，\"这个箱子里是什么呀？\" 店员停下来，看了一眼箱子，露出一个有点为难的表情。 \"这个啊……是'嗅嗅'，一只澳洲产的小家伙。\" \"嗅嗅？\" \"对，它们喜欢闪闪发光的东西。\"店员解释道，\"昨天我们收起来之前，它差点把柜台上的金币全都吞进肚子里。\" 妹妹的眼睛一下子亮了起来。 *完蛋。* \"哥哥——\" \"不行。\" 我还没等她说完就拒绝了。 \"为什么啊！\" \"因为我们才一年级，而且——\"我看了一眼那个还在摇晃的箱子，\"我觉得它会给我们惹很多麻烦。\" 她鼓起脸颊，但没有继续争辩。 我们跟着店员继续往里走，经过了更多稀奇古怪的笼子——有长着蝙蝠翅膀的老鼠，有用鼻音唱歌的植物，还有一只浑身漆黑的猫头鹰正在打盹。 最后，我们来到了店铺的最里面。 \"这是今天的特别推荐。\"店员指着一个玻璃缸说，\"刚到的货，'隐形兽'幼崽。\" 玻璃缸里空无一物。 \"……它在里面吗？\"妹妹疑惑地问。 \"在的。\"店员笑了笑，\"只是你们看不见。\" 我和妹妹面面相觑。 *所以这就是所谓的'看不见'。* 我正准备仔细观察玻璃缸的时候，突然感觉到有什么毛茸茸的东西蹭了蹭我的脚踝。 低头一看—— 一只透明的、毛茸茸的小生物正蹲在我脚边，用它那看不见的眼睛看着我。 \"哥哥！\"妹妹惊呼，\"它找到你了！\" *……我是不是应该感到高兴？* \"成交！\" 她一把挽住我的胳膊，拖着我穿过热闹的街道。石板路上铺着薄薄一层落叶，大概是昨晚的风吹下来的。阳光斜斜地打在对旁的屋顶上，给那些歪歪斜斜的烟囱镀上一层金边。 \"哥哥你知道吗，\"她边走边说，\"刚才我在车站看到一本书，叫《霍格沃茨：