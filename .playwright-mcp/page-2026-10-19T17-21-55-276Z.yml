            - generic [ref=f1e50]:
              - paragraph [ref=f1e51]: 哥哥
              - generic [ref=f1e52]: "\"哥哥哥哥，你快看这个！\" 妹妹的声音从前方传来，带着那种发现了新奇事物时特有的兴奋。我加快脚步走过去，顺着她手指的方向望去——那是一家小小的魔法糖果店，橱窗里陈列着各种颜色的糖果罐，标签上写着\"比比多味豆\"、\"巧克力蛙\"、\"鼻涕虫软糖\"之类的名字。 \"这有什么好看的。\"我伸手揉了揉她的头发，\"不过是些普通的魔法零食而已。\" \"才不是普通的！\"她瞪大眼睛反驳，\"你看这个——'特浓跳跳球'，标签上写着'吃下去后会在原地跳个不停，直到魔法消退为止'！还有这个'梦境棉花糖'，说是睡前吃会做一整晚的彩色的梦呢！\" *她兴奋得像只发现了宝藏的小松鼠，眼睛亮晶晶的。* 我无奈地叹了口气。其实这些糖果我早就听说过了，在入学前的那封录取通知书里，霍格沃茨就附赠了一份《新生必读手册》，里面专门有一章介绍对角巷的特色店铺。但妹妹显然没仔细看过那份手册，或者说她根本没把那本厚厚的册子当回事。 \"你不会是想把这些都尝一遍吧？\"我有些警惕地问。 \"当然啦！\"她毫不犹豫地点头，\"既然来了魔法世界，当然要体验一下这里的特色嘛！\" *我太了解她了，这个小鬼肯定早就盘算着怎么把各种糖果都试一遍。* \"那可不行，\"我严肃地摇摇头，\"我们才刚到霍格沃茨，对这里的一切都还不熟悉。如果吃坏了肚子，或者中了什么奇怪的魔法效果，明天上课的时候出洋相怎么办？\" 她撅起嘴，显然不太服气：\"那哥哥你想去哪里冒险呢？\" 我看了看四周。这是霍格沃茨城堡附近的小镇——霍格莫德村，每到周末学生们就会被允许来这里游玩。此时正是午后时分，阳光斜斜地洒在石板路上，两旁的店铺招牌在微风中轻轻摇晃。 *说实话，我自己也不知道该去哪里。* *但作为哥哥，总不能在她面前表现出犹豫的样子。* \"要不我们去'蜂蜜公爵'的地窖酒吧坐坐？\"我想了想说道，\"听说那里有全霍格沃茨最好喝的热可可，而且——\" \"不要！\"妹妹打断我，\"哥哥你太保守了！既然是来冒险的，就应该去一些刺激的地方！\" \"比如？\" 她神秘地眨眨眼，压低声音说：\"我听说霍格莫德村有个地方，叫'尖叫棚屋'。据说那里曾经是霍格沃茨最恐怖的地方——\" \"不行。\"我立刻打断她，\"那里是禁地，绝对不能去。\" 她鼓起脸颊，显然对我的回答很不满：\"为什么啊！既然是冒险，当然要去别人不敢去的地方！\" \"因为我们是来学习的，不是来送命的。\"我严肃地说，\"而且我们才一年级，很多魔法都还不会。如果在尖叫棚屋里遇到什么麻烦，连自保的能力都没有。\" 她沉默了一会儿，然后突然拉住我的手：\"那哥哥你带我去'魔法动物商店'好不好？我听说那里有卖小精灵幼崽的！\" \"小精灵？\"我愣了一下，\"你是说家养小精灵？那不是用来做家务的吗？\" \"才不是！\"她急切地解释，\"是那种很小很小的、可以装进口袋里的魔法生物！我在《奇兽饲育学》的课本上看到过，它们可以帮人传递消息，而且特别可爱——\" *她越说越兴奋，完全忘了刚才还在抱怨我保守。* 我看着她闪闪发亮的眼睛，忍不住笑了：\"好吧，那我们就去看看。不过先说好，只能看不能买。我们才刚入学，养宠物的事情等以后再说。\" \"耶！哥哥最好了！\" 她高兴得跳了起来，拉着我的手就往街道另一头跑去。 *这丫头，真是拿她没办法。* *不过看她这么开心，这次霍格沃茨之旅应该会很有趣吧。* 阳光在石板路上投下两道长长的影子，一大一小，牵着手向前走去。魔法世界的冒险，才刚刚开始。"
