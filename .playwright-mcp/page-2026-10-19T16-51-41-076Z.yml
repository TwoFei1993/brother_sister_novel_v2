      - generic [ref=f91e1602]:
        - article [ref=f91e1603]:
          - heading "第3章 试炼之门" [level=2] [ref=f91e1604]
          - paragraph [ref=f91e1606]: 【深测改写】兄妹在石门前停下了脚步。幽蓝的光芒在裂缝中脉动，妹妹数着自己的心跳。
        - article [ref=f91e1607]:
          - heading "第4章 试炼之门" [level=2] [ref=f91e1608]
          - generic [ref=f91e1609]:
            - paragraph [ref=f91e1610]: 晨光刺破云层，少年在废墟之上睁开双眼。远处石门的裂缝中渗出幽蓝光芒，仿佛沉睡千年的呼吸。
            - paragraph [ref=f91e1611]:
              - text: 妹妹攥住他的衣角，声音压得很低："
              - strong [ref=f91e1612]: 哥，门后有东西在看着我们。
              - text: "\""
            - paragraph [ref=f91e1613]: 他握紧手中的断剑，向前迈出一步。风停了，世界安静得只剩下两个人的心跳。
