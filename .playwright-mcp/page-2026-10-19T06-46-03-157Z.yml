          - article [ref=f7e1590]:
            - heading "第6章" [level=2] [ref=f7e1591]
            - generic [ref=f7e1592]:
              - paragraph [ref=f7e1593]: 天蒙蒙亮的时候，林枫被一阵急促的脚步声惊醒。
              - paragraph [ref=f7e1594]: 他几乎是本能地从床上弹起，手中已经多了一柄长刀。门被撞开的瞬间，一道瘦小的身影跌跌撞撞冲了进来，带着一股子浓重的血腥味。
              - paragraph [ref=f7e1595]: "\"哥……\""
              - paragraph [ref=f7e1596]: 是林雪。
              - paragraph [ref=f7e1597]: 她的脸色苍白如纸，左肩处被什么利器划过，鲜血已经把半边衣衫都浸透了。林枫一把扶住她，单手探查伤势——伤口深可见骨，但所幸没有伤到要害。
          - article [ref=f7e1598]:
            - heading "承接前文便利店循环剧情继续写下一章" [level=2] [ref=f7e1599]
            - generic [ref=f7e1600]:
              - paragraph [ref=f7e1601]: 林雪的身体在发抖，不知道是因为疼痛还是恐惧。她死死抓着林枫的衣襟，指节因为用力而泛白。
              - paragraph [ref=f7e1602]: "\"客栈里有……有东西……\"她断断续续地说，\"我们看错人了……那根本不是普通的商队……\""
              - paragraph [ref=f7e1603]: 林枫的瞳孔骤然收缩。
              - paragraph [ref=f7e1604]: 他一边从储物袋里取出止血散敷在林雪伤口上，一边沉声问："什么情况？"
              - paragraph [ref=f7e1605]: "\"他们……他们不是人……\"林雪的身体抖得更厉害了，\"我看见了，那队商人的领队，在火光下没有影子……而且……\""
              - paragraph [ref=f7e1606]: 她猛地抬起头，眼眶通红："哥，那个女人——就是给我们递水囊的那个女人——我看见她笑了，在那些东西扑过来的时候，她在笑！"
              - paragraph [ref=f7e1607]: 林枫的动作顿了一下。
              - paragraph [ref=f7e1608]: 止血散的效果很好，血已经止住了，但林雪的脸色依然很难看。林枫把她扶到墙角坐下，自己则走到门边，耳朵贴在门板上仔细听外面的动静。
              - paragraph [ref=f7e1609]: 很安静。
              - paragraph [ref=f7e1610]: 但这种安静太反常了。这个时辰，客栈的厨房应该已经在准备早膳了。走廊里应该有伙计的脚步声、客人洗漱的说话声。可现在，什么都没有。
              - paragraph [ref=f7e1611]: 只有风从门缝里挤进来，带着一股若有若无的腥味。
              - paragraph [ref=f7e1612]: "\"哥……\"林雪的声音从身后传来，很轻，\"我们是不是不应该接那个任务？\""
              - paragraph [ref=f7e1613]: 林枫没有回头。
              - paragraph [ref=f7e1614]: 他当然知道妹妹在说什么。三天前他们兄妹俩在这座边陲小镇落脚，准备补充一些物资后就继续北上。那天下午，一支商队从南边进镇，领队的是个面容和善的中年男人，说是要雇佣两个有功夫的护卫，护送他们穿过前面的"黑风岭"。
              - paragraph [ref=f7e1615]: 酬劳很丰厚——每人五十两白银。
              - paragraph [ref=f7e1616]: 林枫本想拒绝，因为那支商队给他的感觉很怪。但林雪说他们身上的盘缠不多了，五十两足够他们再撑两个月。而且黑风岭的路程也就三天，不会有什么问题。
              - paragraph [ref=f7e1617]: 他答应了。
              - paragraph [ref=f7e1618]: 现在想来，从那一刻起，他们就已经踏入了一个陷阱。
              - paragraph [ref=f7e1619]: 门外突然传来"笃笃笃"的敲门声。
              - paragraph [ref=f7e1620]: 林枫的手已经按在了刀柄上。
              - paragraph [ref=f7e1621]: "\"小兄弟，\"门外是一个中年男人的声音，和善里带着几分关切，\"我听说你妹妹受伤了？我带了些金疮药来，都是我们商队里上好的伤药，姑娘家金贵，别留下疤。\""
              - paragraph [ref=f7e1622]: 是那个商队领队的声音。
              - paragraph [ref=f7e1623]: 林雪在身后发出了一声压抑的呜咽。
              - paragraph [ref=f7e1624]: "\"哥……别开门……\""
              - paragraph [ref=f7e1625]: 林枫当然不会开门。
              - paragraph [ref=f7e1626]: 但他也没有出声。他在等。
              - paragraph [ref=f7e1627]: 果然，门外又传来另一个声音——是个女人的声音，娇媚里带着几分慵懒："林公子，奴家知道你还没睡。昨夜的事是我们照顾不周，但那些东西已经被我们解决了。今晚不会有了。"
              - paragraph [ref=f7e1628]: 她顿了顿，声音里多了一丝意味深长："……何况，你以为不开门就安全吗？这间客栈，本来就是我们开的啊。"
              - paragraph [ref=f7e1629]: 林枫的瞳孔猛地一缩。
              - paragraph [ref=f7e1630]: 他一把掀开窗户——窗户外面不是街道，是一堵墙。
              - paragraph [ref=f7e1631]: "\"林公子，\"门外的女人笑声清脆，\"你要是识相，就带着你妹妹乖乖出来。五十两银子，我们照付。穿过黑风岭，你们就自由了。\""
              - paragraph [ref=f7e1632]: "\"要是不识相……\""
              - paragraph [ref=f7e1633]: 门外的声音突然变了，变成了无数个声音重叠在一起，有男有女有老有少，像潮水一样涌来：
              - paragraph [ref=f7e1634]: "\"——那你们就永远留下来。\""
              - paragraph [ref=f7e1635]: 林雪发出一声尖叫。
              - paragraph [ref=f7e1636]: 林枫手中的长刀已经出鞘，刀身在晨光中泛着冷冽的寒芒。
              - paragraph [ref=f7e1637]: "\"林雪。\"他的声音很稳，\"能打吗？\""
              - paragraph [ref=f7e1638]: 身后沉默了一秒。
              - paragraph [ref=f7e1639]: 然后林雪的声音传来，带着一丝咬牙切齿的狠劲："……能。"
              - paragraph [ref=f7e1640]: "\"那就打。\""
              - paragraph [ref=f7e1641]: 林枫一脚踹开房门。
              - paragraph [ref=f7e1642]: 走廊里站满了"人"。
              - paragraph [ref=f7e1643]: 那支商队的所有人——商人、伙计、车夫、甚至那些看起来最普通的杂役——全都站在走廊里。他们都朝着林枫兄妹的房间微笑着。
              - paragraph [ref=f7e1644]: 没有一个有影子。
              - paragraph [ref=f7e1645]: "\"好言难劝该死鬼。\"领队的男人叹了口气，\"那就——动手吧。\""
              - paragraph [ref=f7e1646]: 走廊里所有的"人"同时扑了过来。
              - paragraph [ref=f7e1647]: 林枫长刀横斩，寒光一闪，最前面的一个"人"的头颅已经飞了出去。但让他瞳孔收缩的是——那颗头颅在半空中转了个圈，又稳稳地接回了脖子上，连一丝鲜血都没有。
              - paragraph [ref=f7e1648]: "\"物理攻击无效。\"林雪的声音从身后传来，\"哥，用——\""
              - paragraph [ref=f7e1649]: 她的话没说完，因为一个"伙计"已经扑到了她面前。林雪侧身躲过，手中的匕首划过对方的喉咙——同样没有血，甚至没有伤口。
              - paragraph [ref=f7e1650]: "\"……用灵气。\"林雪咬着牙补完了这句话。"
              - paragraph [ref=f7e1651]: 林枫当即催动体内灵气，刀身上的寒芒骤然变成了耀眼的金色光芒。他再次挥刀，这一刀带着狂暴的灵气波动，直接将面前三个"人"斩成了三段。
              - paragraph [ref=f7e1652]: 这一次，有血了。
              - paragraph [ref=f7e1653]: 黑色的、腥臭的血。
              - paragraph [ref=f7e1654]: 走廊里响起一声尖锐的嘶吼。
              - paragraph [ref=f7e1655]: "\"你们……竟然敢伤我们！\""
              - paragraph [ref=f7e1656]: 那支商队的"人"们开始变形。他们的皮肤像纸一样裂开，露出下面青灰色的、布满鳞片的躯体。他们的眼睛变得猩红，嘴里长出獠牙，指甲延伸成锋利的爪子。
              - paragraph [ref=f7e1657]: "\"哥，是妖族！\"林雪喊道，\"而且不止一个——我们捅了妖窝了！\""
              - paragraph [ref=f7e1658]: 林枫的心沉了下去。
              - paragraph [ref=f7e1659]: 一个两个妖族他还能应付，但这里至少有三十个，而且能伪装成人类、隐藏妖气这么久，实力绝对不弱。
              - paragraph [ref=f7e1660]: "\"往楼下退！\""
              - paragraph [ref=f7e1661]: 林枫一把拉起林雪，两人从二楼窗户一跃而下。
              - paragraph [ref=f7e1662]: 客栈的院子里已经站满了妖族。他们形成了一个完美的包围圈，留给林枫兄妹的只有一个方向——
              - paragraph [ref=f7e1663]: 黑风岭。
              - paragraph [ref=f7e1664]: "\"跑吧。\"那个女人——现在已经变成了一条人首蛇身的女妖——的声音从楼上传来，\"我们会在黑风岭等你们。\""
              - paragraph [ref=f7e1665]: "\"那里，才是你们真正的葬身之地。\""
