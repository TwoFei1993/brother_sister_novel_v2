          - article [ref=f7e884]:
            - heading "第一章：小票" [level=2] [ref=f7e885]
            - button "本章要点提纲（点击展开）" [ref=f7e887]:
              - generic [aria-hidden] [ref=f7e888]: 📋
              - text: 本章要点提纲（点击展开）
            - generic [ref=f7e889]:
              - list [ref=f7e890]:
                - listitem [ref=f7e891]: 都市怪谈 / 悬疑惊悚 / 微恐怖
                - listitem [ref=f7e892]: 文字风格：克制、压迫感强，环境描写细腻
                - listitem [ref=f7e893]: 节奏：缓起骤落，制造认知异常感
              - list [ref=f7e894]:
                - listitem [ref=f7e895]:
                  - strong [ref=f7e896]: 章末钩子
                  - list [ref=f7e897]:
                    - listitem [ref=f7e898]: 林秋低头时发现小票上"还剩七根"变成"还剩六根"
              - separator [ref=f7e899]
              - heading "正文" [level=2] [ref=f7e900]
              - paragraph [ref=f7e901]: 凌晨两点四十分。
              - paragraph [ref=f7e902]: 便利店的日光灯发出细微的电流声，像某种老旧动物在喘息。林秋把最后一批过期便当塞进回收箱，用抹布擦了擦收银台。
              - paragraph [ref=f7e903]: 他没有注意到那张小票。
              - paragraph [ref=f7e904]: 准确地说，小票是慢慢出现的。从收银机打印口的缝隙里，一毫米、一毫米地往外吐，像条白得发青的舌头。
              - paragraph [ref=f7e905]: 林秋转身去货架补货时，那张纸条已经完全垂落，悬在台面边缘轻轻晃荡。
              - paragraph [ref=f7e906]: 那是一张标准的热敏打印小票。
              - paragraph [ref=f7e907]:
                - text: 抬头印着店铺名、地址、电话。消费时间：
                - strong [ref=f7e908]: 03:17
                - text: 。
              - paragraph [ref=f7e909]: 林秋愣住。
              - paragraph [ref=f7e910]: 现在是两点四十一分。一张写着未来时间的小票，从没有顾客的收银台里自己吐了出来。
              - paragraph [ref=f7e911]: 他下意识看向玻璃门外。空荡荡的街道，路灯把梧桐树影切成一地碎纸。卷闸外贴着的"24小时营业"海报被风吹得一张一合，像在呼吸。
              - paragraph [ref=f7e912]: 林秋把视线收回，落在小票内容上。
              - paragraph [ref=f7e913]:
                - text: 商品栏只有一行：
                - strong [ref=f7e914]: 白色蜡烛 一根 ￥7.00
              - paragraph [ref=f7e915]: 付款方式：现金。 找零：无。
              - paragraph [ref=f7e916]: 收银员编号栏是空白的。而"顾客签名"的位置，打印出的不是文字——是一个轮廓。模糊的、五官不清的人形，像是某种被压扁后又揉皱的影子。
              - paragraph [ref=f7e917]: 最奇怪的是小票背面。
              - paragraph [ref=f7e918]: 翻过来，林秋看到一排手写的小字。圆珠笔，力透纸背，笔画歪斜却极其用力：
              - paragraph [ref=f7e919]:
                - strong [ref=f7e920]: 还剩七根。
              - paragraph [ref=f7e921]: 后台冰柜的压缩机猛地"嘭"了一声。林秋的肩膀肉眼可见地弹了一下。
              - paragraph [ref=f7e922]: 他打开收银机后台记录查询——03:17，没有任何交易流水。调出监控：两点四十分到三点十七分的时间段里，便利店内外零客流。收银台前空无一人。
              - paragraph [ref=f7e923]: 没有顾客。
              - paragraph [ref=f7e924]: 没有交易。
              - paragraph [ref=f7e925]: 没有小票。
              - paragraph [ref=f7e926]: 可它就在他手里。墨迹还没干透，蹭在他的拇指上，染了一点蓝黑色的指纹。
              - paragraph [ref=f7e927]: 林秋想撕了它。手撕到一半，纸张突然在指间变烫，像被谁攥过。
              - paragraph [ref=f7e928]: 他松手。
              - paragraph [ref=f7e929]: 小票飘落回台面。
              - paragraph [ref=f7e930]:
                - text: 空调出风口"呜"地转了一下。门外那块闪动的LED招牌突然黑了半秒，再亮起来时，绿色的"24"变成了红色的"
                - strong [ref=f7e931]: "7"
                - text: "\"。"
              - paragraph [ref=f7e932]: 林秋盯着那块招牌，脖子一阵发凉。
              - paragraph [ref=f7e933]: 他强迫自己把目光移回小票。在灯光下，那行手写字仿佛被雾气晕开了一点。他眨了眨眼，确认自己没有看错——
              - paragraph [ref=f7e934]:
                - strong [ref=f7e935]: 还剩六根。
              - paragraph [ref=f7e936]: 刚才明明是七。
              - paragraph [ref=f7e937]: 门外的风突然大了。卷闸在风中咣当作响，海报被整个撕下来贴在地上。林秋弯腰去捡，抬起头时，玻璃上映出他自己的脸。
              - paragraph [ref=f7e938]: 而他身后，站着别人。
              - paragraph [ref=f7e939]:
                - emphasis [ref=f7e940]: （持续更新，下一章预告：店里开始出现第二张小票。）
          - article [ref=f7e941]:
            - heading "# 要点提纲" [level=2] [ref=f7e942]
            - button "本章要点提纲（点击展开）" [ref=f7e944]:
              - generic [aria-hidden] [ref=f7e945]: 📋
              - text: 本章要点提纲（点击展开）
            - generic [ref=f7e946]:
              - list [ref=f7e947]:
                - listitem [ref=f7e948]: 数字倒数结构：六→五（招牌再次变化）→四
              - list [ref=f7e949]:
                - listitem [ref=f7e950]:
                  - strong [ref=f7e951]: 章末钩子
                  - list [ref=f7e952]:
                    - listitem [ref=f7e953]: 电话那头"自己"最后说："第四根蜡烛会替你回答。"
                    - listitem [ref=f7e954]: 便利店货架某处，突然亮起微弱烛光
              - separator [ref=f7e955]
              - heading "正文" [level=2] [ref=f7e956]
              - paragraph [ref=f7e957]: 那张小票没有离开收银台。
              - paragraph [ref=f7e958]: 林秋试过三次。第一次他把它揉成团扔进垃圾桶，三十秒后它重新出现在打印口，纸面平整得像从未被触碰。第二次他用打火机烧，火焰刚舔上纸角，纸张便自己从指缝间滑走，落回原位。第三次他干脆把它塞进抽屉锁起来——拉开抽屉，里面空无一物。再一回头，小票又挂在收银台边缘。
              - paragraph [ref=f7e959]: 他不再试了。
              - paragraph [ref=f7e960]: 凌晨三点整。店里的冰柜发出均匀的嗡鸣。玻璃门外的风停了，但那块LED招牌还在闪。红色的"7"。
              - paragraph [ref=f7e961]: 林秋盯着那块招牌看了一会儿，又把视线压回小票。
              - paragraph [ref=f7e962]:
                - strong [ref=f7e963]: 还剩六根。
              - paragraph [ref=f7e964]: 他揉了揉眼睛。再看。
              - paragraph [ref=f7e965]:
                - strong [ref=f7e966]: 还剩五根。
              - paragraph [ref=f7e967]: 他倒吸一口凉气，整个人往后退了半步。收银机屏幕的蓝光打在他脸上，把他眼下的阴影染得更深。
              - paragraph [ref=f7e968]: "\"这不对……\"他喃喃。"
              - paragraph [ref=f7e969]: 他开始仔细检查小票的每一处。从正面翻到背面，拇指的纹路碾过纸面。热敏纸特有的银灰色涂层在指腹下沙沙作响。
              - paragraph [ref=f7e970]: 然后他发现新东西。
              - paragraph [ref=f7e971]: 小票最下方，"还剩五根"那几个字下面，原本什么都没有的空白处，缓慢地——非常缓慢地——开始渗出墨迹。
              - paragraph [ref=f7e972]: 像是有人正在此刻，用一支看不见的笔，在纸面上写字。
              - paragraph [ref=f7e973]: 一划。一划。又一划。
              - paragraph [ref=f7e974]:
                - strong [ref=f7e975]: 1-3-8-0-0-2-5-7-4-0-3-1。
              - paragraph [ref=f7e976]: 十一位数字。
              - paragraph [ref=f7e977]: 他认得这个开头。本地手机号段。
              - paragraph [ref=f7e978]: 笔迹写完最后一个"1"后停住了。然后，在号码下方，又多出三个极小的字。圆珠笔，和"还剩X根"是同一种字迹，但更潦草，几乎是刻进纸里的：
              - paragraph [ref=f7e979]:
                - strong [ref=f7e980]: 现在就拨。
              - paragraph [ref=f7e981]: 林秋的喉结上下滚了一下。
              - paragraph [ref=f7e982]: 他是个无神论者。至少三个小时前还是。他相信超市监控、收银系统、法庭上可被质证的物证。他相信人死了就是死了，不会有"还剩几根"这种话。
              - paragraph [ref=f7e983]: 但他从来没在凌晨三点的便利店里，一个人面对过一张会自己变小票的数字。
              - paragraph [ref=f7e984]: 他掏出手机。
              - paragraph [ref=f7e985]:
                - text: 屏幕亮起，锁屏时间是
                - strong [ref=f7e986]: 03:17
                - text: 。
              - paragraph [ref=f7e987]: 林秋的手悬在拨号键上方。屏幕冷光照在他脸上，把他的瞳孔映成两个针孔大小的黑点。
              - paragraph [ref=f7e988]:
                - emphasis [ref=f7e989]: ——是巧合。
                - text: 他想。
                - emphasis [ref=f7e990]: 本地号段，13开头的有上百万个。
              - paragraph [ref=f7e991]: 他按下号码。
              - paragraph [ref=f7e992]: "\"嘟——\""
              - paragraph [ref=f7e993]: 第一声忙音。便利店的空调吐出冷气，贴在他后颈。
              - paragraph [ref=f7e994]: "\"嘟——\""
              - paragraph [ref=f7e995]: 第二声。冰柜的压缩机突然停止运转，店里瞬间安静得不正常。
              - paragraph [ref=f7e996]: "\"嘟——\""
              - paragraph [ref=f7e997]: 第三声。
              - paragraph [ref=f7e998]: "\"咔。\""
              - paragraph [ref=f7e999]: 接通了。
              - paragraph [ref=f7e1000]: 没有问候，没有彩铃，没有"您拨打的号码正在通话中"。电话那头是空旷的电流底噪，像某个人把手机举在风很大的地方。
              - paragraph [ref=f7e1001]: 然后那个声音来了。
              - paragraph [ref=f7e1002]: 林秋的手机从耳边滑落了一寸。
              - paragraph [ref=f7e1003]: 那是他自己的声音。
              - paragraph [ref=f7e1004]: 音色，语调，甚至那种说话前习惯性吞咽口水的小动作，全是他。从声波震动耳膜的那一瞬间，他就认出来了——那就是他自己。
              - paragraph [ref=f7e1005]: 但那个人说的是：
              - paragraph [ref=f7e1006]:
                - strong [ref=f7e1007]: "\"……你还没决定吗？\""
              - paragraph [ref=f7e1008]: 林秋张了张嘴。喉咙像被人攥住，发不出声。
              - paragraph [ref=f7e1009]: 他听见自己说——不，是**那个"他"**说：
              - paragraph [ref=f7e1010]:
                - strong [ref=f7e1011]: "\"再不买，蜡烛就不够了。\""
              - paragraph [ref=f7e1012]: 林秋终于找回自己的舌头："……你是谁？"
              - paragraph [ref=f7e1013]: 那个声音沉默了两秒。然后，用一种几乎是温柔的、劝慰的语气说：
              - paragraph [ref=f7e1014]:
                - strong [ref=f7e1015]: "\"我是你。三点十七分的你。\""
              - paragraph [ref=f7e1016]: 林秋的背脊开始冒冷汗。
              - paragraph [ref=f7e1017]: "\"你在哪？\""
              - paragraph [ref=f7e1018]:
                - strong [ref=f7e1019]: "\"和你站在同一个地方。\""
                - text: 那个声音顿了顿，似乎在便利店门口转了转身，
                - strong [ref=f7e1020]: "\"……店里更亮一些。我记得我犹豫了很久。\""
              - paragraph [ref=f7e1021]: 林秋猛地回头看向玻璃门。
              - paragraph [ref=f7e1022]: 玻璃上映着他的倒影。只有他一个人。空荡荡的货架，冰柜的白光，地砖反着冷色。
              - paragraph [ref=f7e1023]: 但他突然意识到哪里不对。
              - paragraph [ref=f7e1024]: 玻璃门的右上角，他记得那里原本贴着一张"禁止吸烟"的标识。现在标识还在，但标识的下方——
              - paragraph [ref=f7e1025]: 玻璃内侧，不知道什么时候，多了一个手印。
              - paragraph [ref=f7e1026]: 五指张开，掌心朝外。
              - paragraph [ref=f7e1027]: 像有人正贴在门内，从外面看进来。
              - paragraph [ref=f7e1028]: 林秋还没来得及反应，手机里的"他"又开口了：
              - paragraph [ref=f7e1029]:
                - strong [ref=f7e1030]: "\"你看到我了。\""
                - text: 那个声音轻轻笑了一下，
                - strong [ref=f7e1031]: "\"不用怕。我那时候也害怕。但后来我懂了——\""
              - paragraph [ref=f7e1032]: 声音低下去，低到几乎要淹没在电流的沙沙声里：
              - paragraph [ref=f7e1033]:
                - strong [ref=f7e1034]: "\"——是你自己去买的。\""
              - paragraph [ref=f7e1035]:
                - strong [ref=f7e1036]: "\"第四根蜡烛会替你回答。\""
              - paragraph [ref=f7e1037]: "\"咔。\""
              - paragraph [ref=f7e1038]: 挂断了。
              - paragraph [ref=f7e1039]:
                - text: 林秋的耳边是忙音。屏幕跳回拨号界面，通话记录显示：
                - strong [ref=f7e1040]: 00:47
                - text: 。
              - paragraph [ref=f7e1041]: 他盯着那个数字，脑子里一片空白。
              - paragraph [ref=f7e1042]: 然后他听见了别的声音。
              - paragraph [ref=f7e1043]: 非常轻。从他身后。从便利店的深处。从他一个人值守了七个小时、从未注意过的最里面那排货架——
              - paragraph [ref=f7e1044]:
                - strong [ref=f7e1045]: "\"噼。\""
              - paragraph [ref=f7e1046]: 一声极细微的爆裂。
              - paragraph [ref=f7e1047]: 林秋转过身。
              - paragraph [ref=f7e1048]: 便利店的尽头，第七排货架，最底层靠墙的位置。那里本该堆着整箱的矿泉水和纸巾。
              - paragraph [ref=f7e1049]: 现在那里亮着一点光。
              - paragraph [ref=f7e1050]: 橘红色的，微弱的，一明一灭。
              - paragraph [ref=f7e1051]: 是烛火。
              - paragraph [ref=f7e1052]: 一根白色的蜡烛，不知被谁点燃，插在矿泉水箱的缝隙里。火焰像一只眼睛，安静地望着他。
              - paragraph [ref=f7e1053]: 而蜡烛旁边的纸箱上，贴着一张新的小票。
              - paragraph [ref=f7e1054]: 他没有走过去。
              - paragraph [ref=f7e1055]: 因为他知道，那张纸条上一定写着：
              - paragraph [ref=f7e1056]:
                - strong [ref=f7e1057]: 还剩四根。
              - paragraph [ref=f7e1058]:
                - emphasis [ref=f7e1059]: （持续更新，下一章预告：林秋开始在货架间发现第三根蜡烛，和"我"留下的第一张字条。）
