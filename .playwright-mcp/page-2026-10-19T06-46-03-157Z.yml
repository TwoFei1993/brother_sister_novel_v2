                  - list [ref=f7e1071]:
                    - listitem [ref=f7e1072]: 林秋在监控里看到"另一个自己"在往货架深处走
                    - listitem [ref=f7e1073]: 此刻他正站在第七排货架前
                    - listitem [ref=f7e1074]: 货架深处传来脚步声——是往他这个方向来的
              - separator [ref=f7e1075]
              - heading "正文" [level=2] [ref=f7e1076]
              - paragraph [ref=f7e1077]: 林秋花了二十分钟说服自己去看监控。
              - paragraph [ref=f7e1078]: 不是不想看。是身体本能地拒绝。人在面对无法解释的事物时，会先拒绝承认它的存在，然后再被迫接受——而"被迫接受"往往比"从未发生"更让人崩溃。
              - paragraph [ref=f7e1079]: 他坐在收银台后面，面前是连接监控的旧台式机。屏幕亮起来时，灰白色的监控画面在黑暗的便利店里显得格外刺眼。
              - paragraph [ref=f7e1080]: 他先回放了从凌晨一点到现在的录像。
              - paragraph [ref=f7e1081]: 01:00——正常。他一个人坐在收银台后面看手机。 01:30——正常。他在补货，弯腰把泡面塞进货架。 02:00——正常。他在擦收银台。 02:30——正常。他去了一趟洗手间，画面里没人，但收银台上多了一杯咖啡。 02:45——正常。
              - paragraph [ref=f7e1082]: 03:00——
              - paragraph [ref=f7e1083]: 林秋的手停在鼠标上。
              - paragraph [ref=f7e1084]: 03:00的画面对应的是便利店大门方向。画面左上角时间戳正常跳动。但门外的卷闸下，玻璃门上映着的不是空荡荡的街道。
              - paragraph [ref=f7e1085]: 是一个人。
              - paragraph [ref=f7e1086]: 侧身，贴着玻璃，站在门外的黑暗里。只能看到模糊的轮廓，像被水泡过的铅笔画。
              - paragraph [ref=f7e1087]: 林秋屏住呼吸，把进度条往回拉了一秒。
              - paragraph [ref=f7e1088]: 没有人。
              - paragraph [ref=f7e1089]: 再拉回来。
              - paragraph [ref=f7e1090]: 又出现了。
              - paragraph [ref=f7e1091]: 不是连贯的——是跳帧式的。每隔一秒，玻璃门外的倒影就多一个人形，但人形的边缘模糊不清，像某种尚未加载完成的图像。
              - paragraph [ref=f7e1092]: 他点开便利店内部的另一个摄像头。画面里是他常坐的收银台。
              - paragraph [ref=f7e1093]: 03:05。03:10。03:15。
              - paragraph [ref=f7e1094]: 林秋在画面里。他坐在那里，低头看手机，屏幕的冷光照在他脸上。
              - paragraph [ref=f7e1095]: 他记得自己那时候在看什么——外卖群里的差评吐槽。完全正常。
              - paragraph [ref=f7e1096]: 03:17。
              - paragraph [ref=f7e1097]: 画面里的他抬起了头。
              - paragraph [ref=f7e1098]: 不是慢慢抬的。是猛地、骤然地，像被什么惊动。他直直地看向——
              - paragraph [ref=f7e1099]: 镜头。
              - paragraph [ref=f7e1100]: 林秋的血液凉了半截。
              - paragraph [ref=f7e1101]:
                - text: 画面里的"他"看着镜头，但看的不是镜头这个物件。
                - strong [ref=f7e1102]: 是镜头后面的人。
              - paragraph [ref=f7e1103]: 那个"他"的嘴唇动了一下。
              - paragraph [ref=f7e1104]: 林秋把画面放大。画质模糊，色彩有偏差，但他能看出那个口型。
              - paragraph [ref=f7e1105]:
                - strong [ref=f7e1106]: "\"你找到我了。\""
              - paragraph [ref=f7e1107]: 画面里的他说完这句话，便站了起来。但他没有往门口走，也没有往洗手间走。
              - paragraph [ref=f7e1108]: 他往便利店深处走去。
              - paragraph [ref=f7e1109]: 第三排货架。第四排。第五排。
              - paragraph [ref=f7e1110]: 他越走越深，越走越慢，像在寻找什么。林秋看着画面里的自己消失在第七排货架的尽头——监控画面到这里就截止了，因为摄像头只能覆盖到第六排。
              - paragraph [ref=f7e1111]: 第七排以后的区域，是监控盲区。
              - paragraph [ref=f7e1112]: 林秋慢慢转过头，看向自己身后的便利店深处。
              - paragraph [ref=f7e1113]: 第七排货架。那里还亮着一点微弱的橘红色光。蜡烛还在烧。
              - paragraph [ref=f7e1114]: 他站起来。椅子在地砖上刮出一声尖锐的响。
              - paragraph [ref=f7e1115]: "\"我刚才没有动过。\"他对自己说。声音很轻，像在说服某个不在场的人。\"03:17的时候我在看手机。我没动过。\""
              - paragraph [ref=f7e1116]: 他开始往货架深处走。
              - paragraph [ref=f7e1117]: 第三排。第四排。第五排。
              - paragraph [ref=f7e1118]: 他走得比画面里那个"自己"快。脚步落在地砖上的声音在空荡荡的店里回响，异常清晰。冰柜的嗡鸣声不知什么时候停了，便利店里安静得像一个密封的盒子。
              - paragraph [ref=f7e1119]: 第六排货架。
              - paragraph [ref=f7e1120]: 前面就是第七排。
              - paragraph [ref=f7e1121]: 林秋停下脚步。
              - paragraph [ref=f7e1122]: 不是因为害怕。是因为他看到了不该看到的东西。
              - paragraph [ref=f7e1123]: 第六排和第七排货架之间的过道——他每天走过无数次的过道——变长了。
              - paragraph [ref=f7e1124]:
                - text: 不是错觉。不是光线昏暗造成的视觉误差。是物理意义上的，
                - strong [ref=f7e1125]: 变长了
                - text: 。
              - paragraph [ref=f7e1126]: 原本只有三步的距离，现在他站在第六排往里看，能看到过道延伸出去至少二十米。两侧的货架在远处变成模糊的色块，像被水稀释过的水彩。
              - paragraph [ref=f7e1127]: 而那根蜡烛的光，就在这条变长的过道尽头。
              - paragraph [ref=f7e1128]: 林秋站着没动。他的理智告诉他应该退回去，应该报警，应该冲出便利店——但他的脚像被钉在地上。
              - paragraph [ref=f7e1129]: 然后他听到了声音。
              - paragraph [ref=f7e1130]: 从过道深处传来的。
              - paragraph [ref=f7e1131]: 不是蜡烛燃烧的细微爆裂。是脚步。
              - paragraph [ref=f7e1132]: 有人正在往他这个方向走。
              - paragraph [ref=f7e1133]: 每一步都踩在过道中央，每一步都不紧不慢，每一步的间隔都非常均匀——像节拍器。
              - paragraph [ref=f7e1134]: 而那个脚步声的节奏，林秋再熟悉不过。
              - paragraph [ref=f7e1135]: 那是他自己走路的节奏。
              - paragraph [ref=f7e1136]: 过道深处的橘红色光开始晃动了。是有人走过的气流带动的烛焰。烛光把一个影子投在第六排货架的侧面——
              - paragraph [ref=f7e1137]: 影子的轮廓，是林秋的轮廓。
              - paragraph [ref=f7e1138]: 肩膀的高度。头发的长度。甚至右肩微微下沉的习惯性姿势。
              - paragraph [ref=f7e1139]: 那个"他"正在走过来。越来越近。
              - paragraph [ref=f7e1140]: 林秋终于动了一下。他往后退了半步，背撞到了第六排货架的边缘，货架上的薯片袋发出窸窣的响。
              - paragraph [ref=f7e1141]: 脚步声停了。
              - paragraph [ref=f7e1142]: 过道深处，烛光稳稳地燃着。
              - paragraph [ref=f7e1143]: 一个声音从黑暗中传来。是他的声音。沙哑的，带着一种难以形容的疲惫：
              - paragraph [ref=f7e1144]:
                - strong [ref=f7e1145]: "\"……你比我当时还慢。\""
              - paragraph [ref=f7e1146]:
                - strong [ref=f7e1147]: "\"我等了你很久。\""
              - paragraph [ref=f7e1148]: 烛光后面，缓缓走出一个人。
              - paragraph [ref=f7e1149]: 穿着便利店的工服。脸和监控里一样模糊，五官像被水泡过。但那个姿态，那个右肩微微下沉的习惯，那个说话前先吞咽口水的小动作——
              - paragraph [ref=f7e1150]: 是林秋。
              - paragraph [ref=f7e1151]: 是他自己。
              - paragraph [ref=f7e1152]: 那个"他"举起了手里的东西。
              - paragraph [ref=f7e1153]: 是一根白色的蜡烛。没有点燃。
              - paragraph [ref=f7e1154]:
                - strong [ref=f7e1155]: "\"还剩两根。\""
                - text: 那个"他"说，声音平静得像在念一份收据，
                - strong [ref=f7e1156]: "\"一根给你。一根给我。\""
              - paragraph [ref=f7e1157]:
                - strong [ref=f7e1158]: "\"但你要先回答我一个问题。\""
              - paragraph [ref=f7e1159]:
                - strong [ref=f7e1160]: "\"——你还记得自己是怎么进来的吗？\""
              - paragraph [ref=f7e1161]: 林秋的瞳孔猛地收缩。
              - paragraph [ref=f7e1162]: 他想回答。他当然记得。他是今天下午两点来上班的，从员工通道进来的，刷卡，签到，换工服。一切正常。
              - paragraph [ref=f7e1163]: 但当他试图回忆那个画面时，他的脑子里只有一片空白。
              - paragraph [ref=f7e1164]:
                - text: 不是"忘了"。是
                - strong [ref=f7e1165]: 根本不存在
                - text: 。
              - paragraph [ref=f7e1166]: 他没有任何关于"今天下午两点上班"的记忆。他只记得自己"一直"在这里。从凌晨一点到现在的每一秒，他都在这里。中间没有"之前"。
              - paragraph [ref=f7e1167]: 林秋张了张嘴，什么都说不出来。
              - paragraph [ref=f7e1168]: 那个"他"看着他，模糊的脸上似乎浮现出一丝笑意。
              - paragraph [ref=f7e1169]:
                - strong [ref=f7e1170]: "\"没关系。\""
                - text: 他说，把手里的蜡烛往前递了递，
                - strong [ref=f7e1171]: "\"蜡烛会帮你想起来的。\""
              - paragraph [ref=f7e1172]:
                - strong [ref=f7e1173]: "\"你只需要点着它。\""
              - paragraph [ref=f7e1174]:
                - emphasis [ref=f7e1175]: （持续更新，下一章预告：林秋接过蜡烛——火柴盒里只剩两根火柴。）
          - article [ref=f7e1176]:
            - heading "林秋跟随第二个自己走进储物间后的暗门先在" [level=2] [ref=f7e1177]
            - button "本章要点提纲（点击展开）" [ref=f7e1179]:
              - generic [aria-hidden] [ref=f7e1180]: 📋
              - text: 本章要点提纲（点击展开）
            - generic [ref=f7e1181]:
              - list [ref=f7e1182]:
                - listitem [ref=f7e1183]: 火柴盒里只剩两根火柴
                - listitem [ref=f7e1184]: 火柴盒背面写着："每一根可以打开一扇门"
                - listitem [ref=f7e1185]: 重点："你只有一次点火的机会"
              - list [ref=f7e1186]:
                - listitem [ref=f7e1187]:
                  - strong [ref=f7e1188]: 章末钩子
                  - list [ref=f7e1189]:
                    - listitem [ref=f7e1190]: 两人站在第七层门前
                    - listitem [ref=f7e1191]: 第二个林秋说："这扇门后面不是答案。你想清楚再开。"
                    - listitem [ref=f7e1192]: 门内传来林秋自己的声音，反复说着同一句话——是"第三个林秋"
              - separator [ref=f7e1193]
              - heading "正文" [level=2] [ref=f7e1194]
              - paragraph [ref=f7e1195]: 第二个林秋走在他前面。
              - paragraph [ref=f7e1196]: 他举着那根未点燃的蜡烛，烛芯在空气里轻轻颤抖，像一只正在探路的触角。便利店的日光灯管在他身后越来越远，光线被货架切割成一条条细长的白带。
              - paragraph [ref=f7e1197]: 他们穿过第七排货架，穿过原本不存在的过道，穿过林秋七个小时值班从未注意到的最里面那面墙——
              - paragraph [ref=f7e1198]: 那里本该是仓库的卷帘门。
              - paragraph [ref=f7e1199]: 但现在，卷帘门消失了。取而代之的是一扇老旧的木门，漆皮剥落，露出下面灰白色的木纹。门上没有把手，只有一个黄铜钥匙孔，锁眼里透出一点点微弱的橘红色光。
              - paragraph [ref=f7e1200]: "\"这里……\"林秋的声音有些发干，\"我在这里上了两年班。\""
              - paragraph [ref=f7e1201]: "\"嗯。\"第二个林秋没有回头，\"我也是。\""
              - paragraph [ref=f7e1202]: 他把蜡烛举高了一点，烛光照亮木门的下半部分。林秋这才看见——
              - paragraph [ref=f7e1203]: 门板的下缘，有一行用黑色记号笔写的字。字迹歪歪扭扭，笔画的末端都往上挑，像是写字的人手在抖：
              - paragraph [ref=f7e1204]:
                - strong [ref=f7e1205]: "\"第七次。别忘了带火。\""
              - paragraph [ref=f7e1206]: 第二个林秋的脚步顿了顿。
              - paragraph [ref=f7e1207]: "\"……第七次。\"他重复了一遍，声音很轻，像是在确认一个让他自己也害怕的数字。然后他继续往前走，\"走吧。\""
              - paragraph [ref=f7e1208]: 他没有推门。他蹲下身，把手按在门板底部的踢脚线上，往上一推。
              - paragraph [ref=f7e1209]: 木门没有动。
              - paragraph [ref=f7e1210]: 但踢脚线的下方，露出一个黑洞洞的方形开口——一块原本嵌在木门底部的铁板被推了进去，露出一段向下的楼梯。
              - paragraph [ref=f7e1211]: 林秋看着那个黑黝黝的洞口，胃里泛起一阵恶心。
              - paragraph [ref=f7e1212]: "\"这是哪儿？\""
              - paragraph [ref=f7e1213]: "\"储物间。\"第二个林秋说，\"你以前从来没进来过。\""
              - paragraph [ref=f7e1214]: "\"我以前也没注意过这里有门。\""
              - paragraph [ref=f7e1215]: "\"嗯。\"第二个林秋往下走了第一级台阶，铁扶手在他手心里发出一声闷响，\"因为它只在特定时间打开。\""
              - paragraph [ref=f7e1216]: "\"什么时间？\""
              - paragraph [ref=f7e1217]: "\"03:17。\""
              - paragraph [ref=f7e1218]: 他没有再解释。他开始往下走。
              - paragraph [ref=f7e1219]: 林秋犹豫了一秒，跨过洞口边缘。
              - paragraph [ref=f7e1220]: 楼梯比想象中更窄。每一级台阶都只够一个人通过，两个人前后脚走，前面的人呼出的气会扑到后面人的脸上。第二个林秋身上的气味很淡——是便利店仓库里那种纸板箱和过期饮料混合的味道，混着一丝若有若无的塑料燃烧味。
              - paragraph [ref=f7e1221]: 他闻了闻自己身上。
              - paragraph [ref=f7e1222]: 同样的味道。
              - paragraph [ref=f7e1223]: 第一层楼梯到底。铁扶手在这里拐了个弯，继续往下。墙上的白漆已经开始剥落，露出下面灰黑色的水泥。潮湿的墙皮散发出一种地下室的霉味，但这种霉味不像是长年累月形成的——更像是刚生成几天的。
              - paragraph [ref=f7e1224]: 林秋的手指划过墙面。
              - paragraph [ref=f7e1225]: 墙皮是潮的。
              - paragraph [ref=f7e1226]: "\"第一层。\"第二个林秋在前面低声说。"
              - paragraph [ref=f7e1227]: 林秋这才注意到——墙壁上，用什么尖锐的东西，刻着一个数字。
              - paragraph [ref=f7e1228]:
                - strong [ref=f7e1229]: 1。
              - paragraph [ref=f7e1230]: 笔画很浅，刻痕很新，边缘还带着白色的粉尘。是用钥匙、或者指甲刻出来的。
              - paragraph [ref=f7e1231]: 林秋盯着那个数字："这是谁刻的？"
              - paragraph [ref=f7e1232]: 第二个林秋没有回答。
              - paragraph [ref=f7e1233]: 他继续往下走。
              - paragraph [ref=f7e1234]: 第二层。
              - paragraph [ref=f7e1235]:
                - text: 墙上的数字是
                - strong [ref=f7e1236]: "2"
                - text: 。刻痕比第一层深一点，边缘的粉尘少了，像是刻了很久才被人发现。
              - paragraph [ref=f7e1237]: 第三层。
              - paragraph [ref=f7e1238]:
                - strong [ref=f7e1239]: "3"
                - text: 。刻痕更深了。刻痕里有几道横向的划痕，像是在刻这个数字的时候，刻的人手在剧烈地抖。
              - paragraph [ref=f7e1240]: 第四层。
              - paragraph [ref=f7e1241]:
                - strong [ref=f7e1242]: "4"
                - text: 。数字旁边多了几个字。林秋凑近去看——是圆珠笔写的，字迹和便利店小票上的一模一样：
              - paragraph [ref=f7e1243]:
                - strong [ref=f7e1244]: "\"还剩三根。我在第三排。\""
              - paragraph [ref=f7e1245]: 第五层。
              - paragraph [ref=f7e1246]:
                - strong [ref=f7e1247]: "5"
                - text: 。没有字。但刻这个数字的人显然用了非常大的力气——刻痕深得能伸进去一根手指。数字的右下角还残留着一点干涸的、暗红色的东西。
              - paragraph [ref=f7e1248]: 林秋没敢细看。
              - paragraph [ref=f7e1249]: 第六层。
              - paragraph [ref=f7e1250]:
                - strong [ref=f7e1251]: "6"
                - text: 。刻痕是用指甲抠出来的。林秋能看到墙皮上一片一片的剥落，像是被什么野兽挠过。数字"6"的最后一笔拖得很长，延伸出去将近半米，消失在墙角的阴影里。
              - paragraph [ref=f7e1252]: 而在这条刻痕的尽头，用血——或者是和血很像的东西——写着两个极小的字：
              - paragraph [ref=f7e1253]:
                - strong [ref=f7e1254]: "\"救我。\""
              - paragraph [ref=f7e1255]: 林秋停下脚步。
              - paragraph [ref=f7e1256]: 他的腿在发抖。
              - paragraph [ref=f7e1257]: "\"……那是谁？\""
              - paragraph [ref=f7e1258]: 第二个林秋站在第六层和第七层之间的拐角处，背对着他。蜡烛的光把他工服上的褶皱照得发白。
              - paragraph [ref=f7e1259]: "\"都是你。\"他说。声音很平，像在陈述一个事实，\"每一层，都是你在某一轮的痕迹。\""
              - paragraph [ref=f7e1260]: "\"轮？\""
              - paragraph [ref=f7e1261]: "\"七轮。\"他终于转过身来。林秋看不清他的表情，但他的声音里有种说不清的东西——不是恐惧，是比恐惧更深的东西，\"便利店会在每天凌晨03:17打开这扇门。你会进来。你会走下楼梯。你会在第七层之前点着蜡烛。\""
              - paragraph [ref=f7e1262]: "\"然后？\""
              - paragraph [ref=f7e1263]: "\"然后你会进入下一轮。\"第二个林秋顿了顿，\"或者说——你会进入'下一次轮'里的'下一次'。\""
              - paragraph [ref=f7e1264]: "\"……什么意思？\""
              - paragraph [ref=f7e1265]: "\"意思是，你每次走下来，都会以为自己'终于搞清楚了'。但你没有。每次你都只差一步。每次你都只走到第六层就停。\""
              - paragraph [ref=f7e1266]: "\"为什么？\""
              - paragraph [ref=f7e1267]: "\"因为你怕。\""
              - paragraph [ref=f7e1268]: 第二个林秋的模糊面孔在烛光里轻轻晃动了一下。
              - paragraph [ref=f7e1269]: "\"你怕的不是门后面的东西。你怕的是——\""
              - paragraph [ref=f7e1270]: 他没有说下去。
              - paragraph [ref=f7e1271]: 他只是把蜡烛往林秋手里递了递。
              - paragraph [ref=f7e1272]: "\"拿着。\""
              - paragraph [ref=f7e1273]: 林秋接过蜡烛。蜡烛的触感很怪——不是蜡制的触感，更像是一根骨头，干燥、冰冷，但隐约透出一点温度。烛芯不是棉线，是一缕极细的、灰白色的头发。
              - paragraph [ref=f7e1274]: "\"火柴盒。\"第二个林秋从工服口袋里掏出一个纸盒，递给他，\"你只有两根火柴。每根可以打开一扇门。\""
              - paragraph [ref=f7e1275]: "\"门？\""
              - paragraph [ref=f7e1276]: "\"第七层的门。\"第二个林秋用手指了指下方，\"这一轮，你必须走到底。\""
              - paragraph [ref=f7e1277]: "\"然后呢？门后面是什么？\""
              - paragraph [ref=f7e1278]: 第二个林秋没有立刻回答。
              - paragraph [ref=f7e1279]: 他低头看着自己空着的手，沉默了三秒。
              - paragraph [ref=f7e1280]: "\"我不知道。\"他说，\"我走到过第六层。每次都走到第六层。然后我就……\""
              - paragraph [ref=f7e1281]: "\"就什么？\""
              - paragraph [ref=f7e1282]: "\"就忘了我为什么要走下去。\""
              - paragraph [ref=f7e1283]: 楼梯间的空气冷得发颤。
              - paragraph [ref=f7e1284]: 林秋把火柴盒握在手里。纸盒很轻，但他的手指在发抖，盒角在指缝间一颤一颤的。他翻过火柴盒，看到背面用圆珠笔写着两行字：
              - paragraph [ref=f7e1285]:
                - strong [ref=f7e1286]: "\"一根开门。一根照路。\""
                - strong [ref=f7e1287]: "\"你只有一次机会。\""
              - paragraph [ref=f7e1288]: 第七层的门就在下面。
              - paragraph [ref=f7e1289]: 隔着最后几级台阶，林秋能听到门那边传来的声音。极轻的，断断续续的。
              - paragraph [ref=f7e1290]: 是人在说话。
              - paragraph [ref=f7e1291]: 而且是两个人。
              - paragraph [ref=f7e1292]: 两个一模一样的声音在重复着同一句话：
              - paragraph [ref=f7e1293]:
                - strong [ref=f7e1294]: "\"我……我要……我必须……我……\""
              - paragraph [ref=f7e1295]: 第二个林秋突然伸手，按住了林秋的肩膀。
              - paragraph [ref=f7e1296]: "\"这扇门后面不是答案。\"他说，声音比之前更轻，\"是问题。\""
              - paragraph [ref=f7e1297]: "\"什么问题？\""
              - paragraph [ref=f7e1298]: "\"——你愿不愿意成为下一个'我'的问题。\""
              - paragraph [ref=f7e1299]: 他松开了手。
              - paragraph [ref=f7e1300]: "\"想清楚再开。\""
              - paragraph [ref=f7e1301]:
                - emphasis [ref=f7e1302]: （持续更新，下一章预告：林秋点燃火柴——门后是第七个林秋，正在用手指抠墙。）
          - article [ref=f7e1303]:
            - heading "真相揭露：两个林秋必须只留下一个先在 <" [level=2] [ref=f7e1304]
            - button "本章要点提纲（点击展开）" [ref=f7e1306]:
              - generic [aria-hidden] [ref=f7e1307]: 📋
              - text: 本章要点提纲（点击展开）
            - generic [ref=f7e1308]:
              - list [ref=f7e1309]:
                - listitem [ref=f7e1310]: 这不是怪物故事，是关于"被困在循环里的人如何让下一个人少走弯路"
              - list [ref=f7e1311]:
                - listitem [ref=f7e1312]:
                  - strong [ref=f7e1313]: 章末钩子
                  - list [ref=f7e1314]:
                    - listitem [ref=f7e1315]: 林秋点燃两根火柴
                    - listitem [ref=f7e1316]: 门后那个"第七个自己"笑了——他终于等到了
                    - listitem [ref=f7e1317]: 墙上所有刻痕同时消失，便利店恢复原样
                    - listitem [ref=f7e1318]: 但林秋走出店门时，看到一个年轻人正推开员工通道的门——那是明天的他
              - separator [ref=f7e1319]
              - heading "正文" [level=2] [ref=f7e1320]
              - paragraph [ref=f7e1321]: 第七层的门比想象中更小。
              - paragraph [ref=f7e1322]: 是那种老式仓库的防火门，铁皮包边，中间嵌着一个圆形的观察窗。观察窗的玻璃很脏，从外面只能看到模糊的色块。但林秋能看到色块在动。
              - paragraph [ref=f7e1323]: 里面有人。
              - paragraph [ref=f7e1324]: 第二个林秋蹲在门边，从工服内袋里掏出一把极小的钥匙。钥匙是黑色的，像是塑料，但摸上去有金属的冰凉感。他把钥匙插进锁眼，轻轻一转。
              - paragraph [ref=f7e1325]: "\"咔。\""
              - paragraph [ref=f7e1326]: 观察窗后，那个模糊的色块猛地往后退了一步。
              - paragraph [ref=f7e1327]: 然后贴了上来。
              - paragraph [ref=f7e1328]: 林秋终于看清了门后那个人的脸。
              - paragraph [ref=f7e1329]: 是他的脸。
              - paragraph [ref=f7e1330]: 但比他现在的脸老了至少十年。皮肤松弛，眼窝深陷，眼白发黄。嘴唇干裂，裂口里渗着暗红色的血痂。他的工服已经看不出原来的颜色，沾满了灰白色的粉尘和暗红色的污渍。
              - paragraph [ref=f7e1331]: 他赤着脚。十根脚趾的指甲全没了，露出下面鲜红的肉。
              - paragraph [ref=f7e1332]: 而他的手——
              - paragraph [ref=f7e1333]: 他正在用手指抠墙。
              - paragraph [ref=f7e1334]: 十根手指的指甲盖都掀翻了，露出下面粉红色的甲床。指节弯曲的角度已经超出了人体极限，像十根被强行折断的树枝。他的指尖在墙皮上机械地刮动着，每一下都带下来一片灰白色的碎屑。
              - paragraph [ref=f7e1335]: 墙上有字。
              - paragraph [ref=f7e1336]: 很多字。密密麻麻的，挤满了整个墙面。都是用血写的——林秋能闻到那股铁锈味，浓烈得让他胃里翻涌。
              - paragraph [ref=f7e1337]: 最上方一行字最大，写着：
              - paragraph [ref=f7e1338]:
                - strong [ref=f7e1339]: "\"第七轮。我到了。\""
              - paragraph [ref=f7e1340]: 下面一行稍小：
              - paragraph [ref=f7e1341]:
                - strong [ref=f7e1342]: "\"还剩一根。\""
              - paragraph [ref=f7e1343]: 再下面，开始记录他进入这间房间后发生的事。字迹从清晰变得潦草，从潦草变得颤抖，从颤抖变得几乎无法辨认。林秋能看懂的部分断断续续：
              - paragraph [ref=f7e1344]:
                - strong [ref=f7e1345]: "\"……他们让我选择……\""
                - strong [ref=f7e1346]: "\"……我选了七次……\""
                - strong [ref=f7e1347]: "\"……每次都以为这次能出去……\""
                - strong [ref=f7e1348]: "\"……第七个我已经死了……不，是我……\""
                - strong [ref=f7e1349]: "\"……火柴盒里有两根火柴……\""
                - strong [ref=f7e1350]: "\"……两根一起点……两根一起……\""
                - strong [ref=f7e1351]: "\"……必须同时……\""
                - strong [ref=f7e1352]: "\"……\""
              - paragraph [ref=f7e1353]: 最后一行的字已经不像字了，是某种符号的涂鸦，像一个溺水的人在抓最后一根稻草。
              - paragraph [ref=f7e1354]: 第七个林秋的手指停了下来。
              - paragraph [ref=f7e1355]: 他转过头，看向门外的两个自己。
              - paragraph [ref=f7e1356]: 他的嘴唇动了动。声音像是从很远的地方传来，干涩、破碎：
              - paragraph [ref=f7e1357]: "\"……第六个？\""
              - paragraph [ref=f7e1358]: "\"是。\"第二个林秋蹲在门边，声音很平，\"第六个。\""
              - paragraph [ref=f7e1359]: "\"……他呢？\"第七个林秋的眼睛越过第二个林秋，落在林秋身上，\"第五个？\""
              - paragraph [ref=f7e1360]: "\"不是。\"第二个林秋说，\"他没来过。\""
              - paragraph [ref=f7e1361]: 第七个林秋的眼睛亮了一下。那种亮不是希望，是更复杂的东西——像是一个守夜人终于看到了接班人。
              - paragraph [ref=f7e1362]: "\"……第一轮。\""
              - paragraph [ref=f7e1363]: "\"第一轮。\"第二个林秋说。"
              - paragraph [ref=f7e1364]: 第七个林秋突然笑了。
              - paragraph [ref=f7e1365]: 那是一种很轻的笑，嘴角只微微上扬了一点，但整个人的状态都变了。他抠墙的手指终于松了下来，十根手指垂在身侧，血从指尖滴落在地砖上。
              - paragraph [ref=f7e1366]: "\"……你还没明白。\"他对林秋说，声音比之前清晰了一点，\"对吧？\""
              - paragraph [ref=f7e1367]: 林秋张了张嘴。
              - paragraph [ref=f7e1368]: "\"明白什么？\""
              - paragraph [ref=f7e1369]: "\"我们是谁。\"第七个林秋慢慢地从墙边站起来。他的腿在抖，但他还是站直了，\"你以为楼梯上的刻痕是'我'留下的？\""
              - paragraph [ref=f7e1370]: "\"……不是吗？\""
              - paragraph [ref=f7e1371]: "\"是。\""
              - paragraph [ref=f7e1372]: "\"那你说什么——\""
              - paragraph [ref=f7e1373]: "\"但不是同一个人留下的。\""
              - paragraph [ref=f7e1374]: 第七个林秋拖着腿走到门边。他比门外的两个林秋都矮一点——他一直蹲着，脊椎已经压弯了。他抬起手，贴在观察窗的玻璃上。玻璃上映出三个一模一样的轮廓。
              - paragraph [ref=f7e1375]: "\"每一轮，会有一个新的'我'进入便利店。\"他说，\"我会在03:17醒来。我会看到小票。我会数到'还剩七根'。我会走下来。\""
              - paragraph [ref=f7e1376]: "\"然后呢？\""
              - paragraph [ref=f7e1377]: "\"然后我会遇到上一个'我'。\"他指了指门外的第二个林秋，\"然后那个'我'会陪我下来。我们会一起走到第七层。我们会看到这扇门。\""
              - paragraph [ref=f7e1378]: "\"我们会打开。\""
              - paragraph [ref=f7e1379]: "\"我们会看到'我'。\""
              - paragraph [ref=f7e1380]: "\"——然后我们之中的一个，会变成这扇门后面的'我'。\""
              - paragraph [ref=f7e1381]: 林秋的脑子里一片空白。
              - paragraph [ref=f7e1382]: "\"……什么？\""
              - paragraph [ref=f7e1383]: "\"两个只能留一个。\"第七个林秋说得很轻，像在说一个讲过无数遍的故事，\"另一个必须留下来。留下来的人，会成为下一轮门后的人。\""
              - paragraph [ref=f7e1384]: "\"而下一轮，又会有两个新的'我'下来。\""
              - paragraph [ref=f7e1385]: "\"循环。\""
              - paragraph [ref=f7e1386]: 林秋的腿软了一下，他扶住门框才没倒下去。
              - paragraph [ref=f7e1387]: "\"……所以他们——\"他看向第二个林秋，\"他回来，是为了……\""
              - paragraph [ref=f7e1388]: "\"是为了接替我。\"第二个林秋说。"
              - paragraph [ref=f7e1389]: 他转过身，看着林秋。
              - paragraph [ref=f7e1390]: 林秋终于看清了他的脸。
              - paragraph [ref=f7e1391]: 不是模糊的。是清晰的。和林秋一模一样的脸。眼角没有第七个的皱纹，但有林秋没有的疲惫——一种经历过什么又活下来的疲惫。
              - paragraph [ref=f7e1392]: "\"我已经经历过六轮了。\"他说，\"每一轮，我都接替了上一个'我'。每一轮，我都往下沉一层。\""
              - paragraph [ref=f7e1393]: "\"那你为什么还活着？\""
              - paragraph [ref=f7e1394]: "\"因为每一轮，都会有新的'我'进来。\"第二个林秋说，\"新进来的'我'不知道自己是谁。'我'会告诉'我'该怎么做。'我'会带'我'下来。\""
              - paragraph [ref=f7e1395]: "\"然后'我'中的一个人，会成为新的'我'。\""
              - paragraph [ref=f7e1396]: "\"——这就是为什么，我们只能活一个。\""
              - paragraph [ref=f7e1397]: 林秋感觉自己的呼吸在一点一点变慢。
              - paragraph [ref=f7e1398]: "\"……你为什么不早点告诉我？\""
              - paragraph [ref=f7e1399]: "\"因为没用。\"第二个林秋说，\"你知道得再多，也改变不了结局。你只会害怕。害怕了，你就会停。停了，你就会变成下一个'刻痕'。\""
              - paragraph [ref=f7e1400]: "\"但你不会真的停。\"第七个林秋在门后说，\"你只能往下走。因为不走，你就会变成小票上的数字。\""
              - paragraph [ref=f7e1401]: "\"会变成'还剩零根'。\""
              - paragraph [ref=f7e1402]: 林秋低下头。
              - paragraph [ref=f7e1403]: 他看着手里的火柴盒。盒子里只有两根火柴。火柴头上沾着红色的磷，在昏暗的灯光下像两只眼睛。
              - paragraph [ref=f7e1404]: "\"……两根一起点。\"他说，\"墙上写的。\""
              - paragraph [ref=f7e1405]: "\"对。\"第七个林秋说。"
              - paragraph [ref=f7e1406]: "\"两根火柴必须同时燃烧。\""
              - paragraph [ref=f7e1407]: "\"对。\""
              - paragraph [ref=f7e1408]: "\"燃烧之后，会怎么样？\""
              - paragraph [ref=f7e1409]: 第七个林秋没有回答。
              - paragraph [ref=f7e1410]: 他看向第二个林秋。
              - paragraph [ref=f7e1411]: 第二个林秋也没有回答。
              - paragraph [ref=f7e1412]: 林秋抬起头，看着他们两个。两个一样的脸。一个在门里，一个在门外。一个老，一个年轻。但他们看林秋的眼神是一样的。
              - paragraph [ref=f7e1413]: 是送别的眼神。
              - paragraph [ref=f7e1414]: "\"……是我。\"林秋说。"
              - paragraph [ref=f7e1415]: 两个林秋都没有说话。
              - paragraph [ref=f7e1416]: "\"是你们之中的一个，会消失。\""
              - paragraph [ref=f7e1417]: "\"对。\"第二个林秋说。"
              - paragraph [ref=f7e1418]: "\"而活下来的那个——\""
              - paragraph [ref=f7e1419]: "\"活下来的那个，会成为下一个守夜人。\"第七个林秋说，\"会等着下一个'我'进来。会告诉他真相。会陪他下来。会——\""
              - paragraph [ref=f7e1420]: "\"会成为下一个'你'。\"林秋说。"
              - paragraph [ref=f7e1421]: "\"对。\""
              - paragraph [ref=f7e1422]: 林秋低下头，看着火柴盒。
              - paragraph [ref=f7e1423]:
                - text: 盒子的背面写着：
                - strong [ref=f7e1424]: "\"一根开门。一根照路。你只有一次机会。\""
              - paragraph [ref=f7e1425]: "\"……为什么是两根火柴？\""
              - paragraph [ref=f7e1426]: "\"因为门要打开，路要照亮。\"第七个林秋说，\"如果你只点一根——\""
              - paragraph [ref=f7e1427]: "\"你会永远困在这里。\"第二个林秋说，\"永远。\""
              - paragraph [ref=f7e1428]: 林秋把火柴盒握紧。
              - paragraph [ref=f7e1429]: 纸盒的边缘割进他的掌心。但他没有松手。
              - paragraph [ref=f7e1430]: "\"……如果我点两根呢？\""
              - paragraph [ref=f7e1431]: "\"两根一起点。\""
              - paragraph [ref=f7e1432]: "\"门会打开。路会被照亮。\""
              - paragraph [ref=f7e1433]: "\"然后——\""
              - paragraph [ref=f7e1434]: "\"然后门会关上。\"第七个林秋说，\"门关上的时候，门里的人会消失。\""
              - paragraph [ref=f7e1435]: "\"门里的人？\"林秋看向他，\"是你？\""
              - paragraph [ref=f7e1436]: "\"是我。\""
              - paragraph [ref=f7e1437]: "\"……为什么是你？\""
              - paragraph [ref=f7e1438]: "\"因为我是第七个。\"第七个林秋笑了。那种笑和之前不一样了——之前的笑是苦笑，现在的笑是真的笑。是解脱的笑。"
              - paragraph [ref=f7e1439]: "\"我在这里待了太久。\""
              - paragraph [ref=f7e1440]: "\"我已经——\""
              - paragraph [ref=f7e1441]: 他抬起手，看着自己血肉模糊的十根手指。
              - paragraph [ref=f7e1442]: "\"我已经等了很久。\""
              - paragraph [ref=f7e1443]: 林秋的眼睛开始发酸。
              - paragraph [ref=f7e1444]: "\"……我不认识你。\""
              - paragraph [ref=f7e1445]: "\"你不需要认识我。\"第七个林秋说，\"你只需要知道——\""
              - paragraph [ref=f7e1446]: "\"你点着火柴之后，第六层墙上的字会变。\""
              - paragraph [ref=f7e1447]: "\"变成'还剩六根'。\""
              - paragraph [ref=f7e1448]: "\"——然后你会成为下一个守夜人。\""
              - paragraph [ref=f7e1449]: "\"而下一个'我'进来的时候——\""
              - paragraph [ref=f7e1450]: "\"——你会像我一样，等在这里。\""
              - paragraph [ref=f7e1451]: 林秋站在那里，没有动。
              - paragraph [ref=f7e1452]: 他看着门后那个血肉模糊的自己。看着门边那个准备接替自己的自己。
              - paragraph [ref=f7e1453]: 他突然明白了。
              - paragraph [ref=f7e1454]: 这不是怪物故事。
              - paragraph [ref=f7e1455]: 这是一个关于"被困在循环里的人如何让下一个人少走弯路"的故事。
              - paragraph [ref=f7e1456]: 他深吸了一口气。
              - paragraph [ref=f7e1457]: "\"……火柴。\""
              - paragraph [ref=f7e1458]: "\"给你。\"第二个林秋把火柴盒递到他手里。"
              - paragraph [ref=f7e1459]: 林秋打开盒子。
              - paragraph [ref=f7e1460]: 两根火柴并排躺在里面。红色的磷头，黑色的木杆。
              - paragraph [ref=f7e1461]: 他拿起一根。
              - paragraph [ref=f7e1462]: 又拿起一根。
              - paragraph [ref=f7e1463]: 火柴在指间轻轻颤抖。
              - paragraph [ref=f7e1464]: "\"……一起点？\""
              - paragraph [ref=f7e1465]: "\"一起点。\"两个林秋同时说。"
              - paragraph [ref=f7e1466]: 林秋把两根火柴的头靠在一起。
              - paragraph [ref=f7e1467]: 他划亮了第一根。
              - paragraph [ref=f7e1468]: 火焰"噗"的一声燃起来。橘红色的光映在他脸上，映在两个林秋的脸上。
              - paragraph [ref=f7e1469]: 他把第二根凑近第一根的火焰。
              - paragraph [ref=f7e1470]: 两根火柴同时燃烧。
              - paragraph [ref=f7e1471]: 火焰比单根的时候亮。亮得刺眼。亮得整个楼梯间都变成了白色。
              - paragraph [ref=f7e1472]: 林秋听到了一声叹息。
              - paragraph [ref=f7e1473]: 很轻。
              - paragraph [ref=f7e1474]: 是第七个林秋的声音。
              - paragraph [ref=f7e1475]: 然后那声叹息消失了。
              - paragraph [ref=f7e1476]: 第七层的门缓缓打开。
              - paragraph [ref=f7e1477]: 门后是空的。
              - paragraph [ref=f7e1478]: 墙上的血字消失了。地板上的血迹消失了。所有的痕迹都消失了。只有一面干干净净的墙，墙上刻着一个数字：
              - paragraph [ref=f7e1479]:
                - strong [ref=f7e1480]: 6。
              - paragraph [ref=f7e1481]: 林秋的腿软了一下，他跪倒在地上。
              - paragraph [ref=f7e1482]: 火柴已经燃尽了。灰烬从他的指缝间飘落，落在地砖上。
              - paragraph [ref=f7e1483]: 他听到身后有脚步声。
              - paragraph [ref=f7e1484]: 第二个林秋蹲在他身边。
              - paragraph [ref=f7e1485]: "\"……谢谢。\""
              - paragraph [ref=f7e1486]: 林秋没有回答。
              - paragraph [ref=f7e1487]: 他只是看着墙上那个数字。
              - paragraph [ref=f7e1488]:
                - strong [ref=f7e1489]: 6。
              - paragraph [ref=f7e1490]: "\"……你从零开始。\""
              - paragraph [ref=f7e1491]: "\"我知道。\""
              - paragraph [ref=f7e1492]: "\"你会忘记今晚。\""
              - paragraph [ref=f7e1493]: "\"我知道。\""
              - paragraph [ref=f7e1494]: "\"你会忘记我。\""
              - paragraph [ref=f7e1495]: "\"……\"林秋抬起头，看着第二个林秋，\"我会吗？\""
              - paragraph [ref=f7e1496]: "\"会。\"第二个林秋说，\"每一轮都会忘。\""
              - paragraph [ref=f7e1497]: "\"那你——\""
              - paragraph [ref=f7e1498]: "\"我会记得。\"第二个林秋说，\"我会记得你。\""
              - paragraph [ref=f7e1499]: "\"我会替你记着。\""
              - paragraph [ref=f7e1500]: 林秋的眼睛终于湿了。
              - paragraph [ref=f7e1501]: 他不知道为什么哭。他不认识这个人。这个人是他自己。但他不认识。
              - paragraph [ref=f7e1502]: "\"……下一轮。\""
              - paragraph [ref=f7e1503]: "\"下一轮。\"第二个林秋点了点头，\"下一轮，新的'你'会进来。\""
              - paragraph [ref=f7e1504]: "\"我会告诉他真相。\""
              - paragraph [ref=f7e1505]: "\"我会陪他下来。\""
              - paragraph [ref=f7e1506]: "\"我会——\""
              - paragraph [ref=f7e1507]: "\"——你会成为下一个'你'。\""
              - paragraph [ref=f7e1508]: 第二个林秋笑了。
              - paragraph [ref=f7e1509]: "\"对。\""
              - paragraph [ref=f7e1510]: 林秋站起来。
              - paragraph [ref=f7e1511]: 他往楼梯上走。
              - paragraph [ref=f7e1512]: 身后传来第二个林秋的声音：
              - paragraph [ref=f7e1513]: "\"——等一下。\""
              - paragraph [ref=f7e1514]: 林秋停下脚步。
              - paragraph [ref=f7e1515]: "\"……还有一根蜡烛。\""
              - paragraph [ref=f7e1516]: 林秋回过头。
              - paragraph [ref=f7e1517]: 第二个林秋站在第六层和第七层之间的拐角处，手里举着一根白色的蜡烛。
              - paragraph [ref=f7e1518]: "\"还剩六根。\"他说，\"你带走第一根。\""
              - paragraph [ref=f7e1519]: "\"剩下的五根——\""
              - paragraph [ref=f7e1520]: "\"——留给下一轮的你。\""
              - paragraph [ref=f7e1521]: 林秋接过蜡烛。
              - paragraph [ref=f7e1522]: 蜡烛的触感很怪。干燥、冰冷。但烛芯那缕灰白色的头发，在昏暗的灯光下像一只眼睛。
              - paragraph [ref=f7e1523]: "\"……再见。\"林秋说。"
              - paragraph [ref=f7e1524]: "\"再见。\"第二个林秋说。"
              - paragraph [ref=f7e1525]: 林秋转身往楼梯上走。
              - paragraph [ref=f7e1526]: 他一步一步往上走。铁扶手在他手心里发出沉闷的回响。墙上的刻痕在他的指尖下一一划过——
              - paragraph [ref=f7e1527]:
                - strong [ref=f7e1528]: 5。
              - paragraph [ref=f7e1529]:
                - strong [ref=f7e1530]: 4。
              - paragraph [ref=f7e1531]:
                - strong [ref=f7e1532]: 3。
              - paragraph [ref=f7e1533]:
                - strong [ref=f7e1534]: 2。
              - paragraph [ref=f7e1535]:
                - strong [ref=f7e1536]: 1。
              - paragraph [ref=f7e1537]: 他走出储物间。
              - paragraph [ref=f7e1538]: 便利店和他下去之前一样。日光灯在头顶嗡嗡作响。冰柜发出均匀的嗡鸣。玻璃门外是凌晨的街道，路灯把梧桐树影切成一地碎纸。
              - paragraph [ref=f7e1539]: 他走到收银台后面，坐下来。
              - paragraph [ref=f7e1540]: 他看着台面边缘那张小票。
              - paragraph [ref=f7e1541]:
                - strong [ref=f7e1542]: 还剩六根。
              - paragraph [ref=f7e1543]: 他伸手把小票拿起来。
              - paragraph [ref=f7e1544]: 翻到背面。
              - paragraph [ref=f7e1545]: 手写的字迹在灯光下轻轻晃动：
              - paragraph [ref=f7e1546]:
                - strong [ref=f7e1547]: "\"谢谢你。\""
              - paragraph [ref=f7e1548]: 林秋把小票折好，放进胸口的口袋里。
              - paragraph [ref=f7e1549]: 他拿起蜡烛。走到便利店最深处的第七排货架。那里有一个矿泉水箱，箱子的缝隙里——
              - paragraph [ref=f7e1550]: 他不知道该怎么做。
              - paragraph [ref=f7e1551]: 但他的手已经动了。
              - paragraph [ref=f7e1552]: 他把蜡烛插进缝隙里。
              - paragraph [ref=f7e1553]: 蜡烛没有点燃。但它开始自己燃烧。
              - paragraph [ref=f7e1554]: 火焰从烛芯里跳出来，橘红色的，微弱的，一明一灭。
              - paragraph [ref=f7e1555]: 林秋看着那点光。
              - paragraph [ref=f7e1556]: 然后他听到了脚步声。
              - paragraph [ref=f7e1557]: 从便利店门外传来。
              - paragraph [ref=f7e1558]: 有人正在推开玻璃门。
              - paragraph [ref=f7e1559]: 门上的风铃发出一声轻响。
              - paragraph [ref=f7e1560]: 林秋抬起头。
              - paragraph [ref=f7e1561]:
                - text: 一个穿着便利店工服的年轻人站在门口。胸口别着工牌。工牌上写着：
                - strong [ref=f7e1562]: 林秋
                - text: 。
              - paragraph [ref=f7e1563]: 他看起来很年轻。看起来很累。看起来——
              - paragraph [ref=f7e1564]: ——刚从员工通道进来。
              - paragraph [ref=f7e1565]: 年轻人的眼睛扫过空荡荡的便利店，落在收银台后面坐着的林秋身上。
              - paragraph [ref=f7e1566]: "\"……你好。\"年轻人说，\"我是新来的。\""
              - paragraph [ref=f7e1567]: 林秋看着他。
              - paragraph [ref=f7e1568]: 他突然想哭。
              - paragraph [ref=f7e1569]: 但他没有哭。
              - paragraph [ref=f7e1570]: 他只是点了点头：
              - paragraph [ref=f7e1571]: "\"欢迎。\""
              - paragraph [ref=f7e1572]: "\"——我叫林秋。\""
              - paragraph [ref=f7e1573]:
                - emphasis [ref=f7e1574]: （全文完）
              - separator [ref=f7e1575]
              - paragraph [ref=f7e1576]:
                - strong [ref=f7e1577]: 【创作后记】
              - paragraph [ref=f7e1578]: 这是一个关于"被困在循环里的人"的故事。
              - paragraph [ref=f7e1579]:
                - text: 他没有怪物，没有反派，没有具体的恶。他只有一个问题：
                - strong [ref=f7e1580]: 如何让下一个人少走弯路。
              - paragraph [ref=f7e1581]: 答案藏在七根蜡烛里。每一根蜡烛燃尽，就会有一个新的"我"醒来。他会看到小票，会数到"还剩七根"，会走下楼梯。他会害怕，会犹豫，会在某一层停下来。
              - paragraph [ref=f7e1582]: 但只要有人记得他——只要有人愿意成为下一个守夜人——
              - paragraph [ref=f7e1583]: ——他就不会真正消失。
              - paragraph [ref=f7e1584]: 他会变成下一个"刻痕"。
              - paragraph [ref=f7e1585]: 他会变成下一个"救我"。
              - paragraph [ref=f7e1586]: 他会变成下一个"谢谢你"。
              - paragraph [ref=f7e1587]: 这不是怪物故事。
