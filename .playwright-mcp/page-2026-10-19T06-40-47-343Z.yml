              - separator [ref=f1e1874]
              - heading "正文" [level=2] [ref=f1e1875]
              - paragraph [ref=f1e1876]: 第七层的门比想象中更小。
              - paragraph [ref=f1e1877]: 是那种老式仓库的防火门，铁皮包边，中间嵌着一个圆形的观察窗。观察窗的玻璃很脏，从外面只能看到模糊的色块。但林秋能看到色块在动。
              - paragraph [ref=f1e1878]: 里面有人。
              - paragraph [ref=f1e1879]: 第二个林秋蹲在门边，从工服内袋里掏出一把极小的钥匙。钥匙是黑色的，像是塑料，但摸上去有金属的冰凉感。他把钥匙插进锁眼，轻轻一转。
              - paragraph [ref=f1e1880]: "\"咔。\""
              - paragraph [ref=f1e1881]: 观察窗后，那个模糊的色块猛地往后退了一步。
              - paragraph [ref=f1e1882]: 然后贴了上来。
              - paragraph [ref=f1e1883]: 林秋终于看清了门后那个人的脸。
              - paragraph [ref=f1e1884]: 是他的脸。
              - paragraph [ref=f1e1885]: 但比他现在的脸老了至少十年。皮肤松弛，眼窝深陷，眼白发黄。嘴唇干裂，裂口里渗着暗红色的血痂。他的工服已经看不出原来的颜色，沾满了灰白色的粉尘和暗红色的污渍。
              - paragraph [ref=f1e1886]: 他赤着脚。十根脚趾的指甲全没了，露出下面鲜红的肉。
              - paragraph [ref=f1e1887]: 而他的手——
              - paragraph [ref=f1e1888]: 他正在用手指抠墙。
              - paragraph [ref=f1e1889]: 十根手指的指甲盖都掀翻了，露出下面粉红色的甲床。指节弯曲的角度已经超出了人体极限，像十根被强行折断的树枝。他的指尖在墙皮上机械地刮动着，每一下都带下来一片灰白色的碎屑。
              - paragraph [ref=f1e1890]: 墙上有字。
              - paragraph [ref=f1e1891]: 很多字。密密麻麻的，挤满了整个墙面。都是用血写的——林秋能闻到那股铁锈味，浓烈得让他胃里翻涌。
              - paragraph [ref=f1e1892]: 最上方一行字最大，写着：
              - paragraph [ref=f1e1893]:
                - strong [ref=f1e1894]: "\"第七轮。我到了。\""
              - paragraph [ref=f1e1895]: 下面一行稍小：
              - paragraph [ref=f1e1896]:
                - strong [ref=f1e1897]: "\"还剩一根。\""
              - paragraph [ref=f1e1898]: 再下面，开始记录他进入这间房间后发生的事。字迹从清晰变得潦草，从潦草变得颤抖，从颤抖变得几乎无法辨认。林秋能看懂的部分断断续续：
              - paragraph [ref=f1e1899]:
                - strong [ref=f1e1900]: "\"……他们让我选择……\""
                - strong [ref=f1e1901]: "\"……我选了七次……\""
                - strong [ref=f1e1902]: "\"……每次都以为这次能出去……\""
                - strong [ref=f1e1903]: "\"……第七个我已经死了……不，是我……\""
                - strong [ref=f1e1904]: "\"……火柴盒里有两根火柴……\""
                - strong [ref=f1e1905]: "\"……两根一起点……两根一起……\""
                - strong [ref=f1e1906]: "\"……必须同时……\""
                - strong [ref=f1e1907]: "\"……\""
              - paragraph [ref=f1e1908]: 最后一行的字已经不像字了，是某种符号的涂鸦，像一个溺水的人在抓最后一根稻草。
              - paragraph [ref=f1e1909]: 第七个林秋的手指停了下来。
              - paragraph [ref=f1e1910]: 他转过头，看向门外的两个自己。
              - paragraph [ref=f1e1911]: 他的嘴唇动了动。声音像是从很远的地方传来，干涩、破碎：
              - paragraph [ref=f1e1912]: "\"……第六个？\""
              - paragraph [ref=f1e1913]: "\"是。\"第二个林秋蹲在门边，声音很平，\"第六个。\""
              - paragraph [ref=f1e1914]: "\"……他呢？\"第七个林秋的眼睛越过第二个林秋，落在林秋身上，\"第五个？\""
              - paragraph [ref=f1e1915]: "\"不是。\"第二个林秋说，\"他没来过。\""
              - paragraph [ref=f1e1916]: 第七个林秋的眼睛亮了一下。那种亮不是希望，是更复杂的东西——像是一个守夜人终于看到了接班人。
              - paragraph [ref=f1e1917]: "\"……第一轮。\""
              - paragraph [ref=f1e1918]: "\"第一轮。\"第二个林秋说。"
              - paragraph [ref=f1e1919]: 第七个林秋突然笑了。
              - paragraph [ref=f1e1920]: 那是一种很轻的笑，嘴角只微微上扬了一点，但整个人的状态都变了。他抠墙的手指终于松了下来，十根手指垂在身侧，血从指尖滴落在地砖上。
              - paragraph [ref=f1e1921]: "\"……你还没明白。\"他对林秋说，声音比之前清晰了一点，\"对吧？\""
              - paragraph [ref=f1e1922]: 林秋张了张嘴。
              - paragraph [ref=f1e1923]: "\"明白什么？\""
              - paragraph [ref=f1e1924]: "\"我们是谁。\"第七个林秋慢慢地从墙边站起来。他的腿在抖，但他还是站直了，\"你以为楼梯上的刻痕是'我'留下的？\""
              - paragraph [ref=f1e1925]: "\"……不是吗？\""
              - paragraph [ref=f1e1926]: "\"是。\""
              - paragraph [ref=f1e1927]: "\"那你说什么——\""
              - paragraph [ref=f1e1928]: "\"但不是同一个人留下的。\""
              - paragraph [ref=f1e1929]: 第七个林秋拖着腿走到门边。他比门外的两个林秋都矮一点——他一直蹲着，脊椎已经压弯了。他抬起手，贴在观察窗的玻璃上。玻璃上映出三个一模一样的轮廓。
              - paragraph [ref=f1e1930]: "\"每一轮，会有一个新的'我'进入便利店。\"他说，\"我会在03:17醒来。我会看到小票。我会数到'还剩七根'。我会走下来。\""
              - paragraph [ref=f1e1931]: "\"然后呢？\""
              - paragraph [ref=f1e1932]: "\"然后我会遇到上一个'我'。\"他指了指门外的第二个林秋，\"然后那个'我'会陪我下来。我们会一起走到第七层。我们会看到这扇门。\""
              - paragraph [ref=f1e1933]: "\"我们会打开。\""
              - paragraph [ref=f1e1934]: "\"我们会看到'我'。\""
              - paragraph [ref=f1e1935]: "\"——然后我们之中的一个，会变成这扇门后面的'我'。\""
              - paragraph [ref=f1e1936]: 林秋的脑子里一片空白。
              - paragraph [ref=f1e1937]: "\"……什么？\""
              - paragraph [ref=f1e1938]: "\"两个只能留一个。\"第七个林秋说得很轻，像在说一个讲过无数遍的故事，\"另一个必须留下来。留下来的人，会成为下一轮门后的人。\""
              - paragraph [ref=f1e1939]: "\"而下一轮，又会有两个新的'我'下来。\""
              - paragraph [ref=f1e1940]: "\"循环。\""
              - paragraph [ref=f1e1941]: 林秋的腿软了一下，他扶住门框才没倒下去。
              - paragraph [ref=f1e1942]: "\"……所以他们——\"他看向第二个林秋，\"他回来，是为了……\""
              - paragraph [ref=f1e1943]: "\"是为了接替我。\"第二个林秋说。"
              - paragraph [ref=f1e1944]: 他转过身，看着林秋。
              - paragraph [ref=f1e1945]: 林秋终于看清了他的脸。
              - paragraph [ref=f1e1946]: 不是模糊的。是清晰的。和林秋一模一样的脸。眼角没有第七个的皱纹，但有林秋没有的疲惫——一种经历过什么又活下来的疲惫。
              - paragraph [ref=f1e1947]: "\"我已经经历过六轮了。\"他说，\"每一轮，我都接替了上一个'我'。每一轮，我都往下沉一层。\""
              - paragraph [ref=f1e1948]: "\"那你为什么还活着？\""
              - paragraph [ref=f1e1949]: "\"因为每一轮，都会有新的'我'进来。\"第二个林秋说，\"新进来的'我'不知道自己是谁。'我'会告诉'我'该怎么做。'我'会带'我'下来。\""
              - paragraph [ref=f1e1950]: "\"然后'我'中的一个人，会成为新的'我'。\""
              - paragraph [ref=f1e1951]: "\"——这就是为什么，我们只能活一个。\""
              - paragraph [ref=f1e1952]: 林秋感觉自己的呼吸在一点一点变慢。
              - paragraph [ref=f1e1953]: "\"……你为什么不早点告诉我？\""
              - paragraph [ref=f1e1954]: "\"因为没用。\"第二个林秋说，\"你知道得再多，也改变不了结局。你只会害怕。害怕了，你就会停。停了，你就会变成下一个'刻痕'。\""
              - paragraph [ref=f1e1955]: "\"但你不会真的停。\"第七个林秋在门后说，\"你只能往下走。因为不走，你就会变成小票上的数字。\""
              - paragraph [ref=f1e1956]: "\"会变成'还剩零根'。\""
              - paragraph [ref=f1e1957]: 林秋低下头。
              - paragraph [ref=f1e1958]: 他看着手里的火柴盒。盒子里只有两根火柴。火柴头上沾着红色的磷，在昏暗的灯光下像两只眼睛。
              - paragraph [ref=f1e1959]: "\"……两根一起点。\"他说，\"墙上写的。\""
              - paragraph [ref=f1e1960]: "\"对。\"第七个林秋说。"
              - paragraph [ref=f1e1961]: "\"两根火柴必须同时燃烧。\""
              - paragraph [ref=f1e1962]: "\"对。\""
              - paragraph [ref=f1e1963]: "\"燃烧之后，会怎么样？\""
              - paragraph [ref=f1e1964]: 第七个林秋没有回答。
              - paragraph [ref=f1e1965]: 他看向第二个林秋。
              - paragraph [ref=f1e1966]: 第二个林秋也没有回答。
              - paragraph [ref=f1e1967]: 林秋抬起头，看着他们两个。两个一样的脸。一个在门里，一个在门外。一个老，一个年轻。但他们看林秋的眼神是一样的。
              - paragraph [ref=f1e1968]: 是送别的眼神。
              - paragraph [ref=f1e1969]: "\"……是我。\"林秋说。"
              - paragraph [ref=f1e1970]: 两个林秋都没有说话。
              - paragraph [ref=f1e1971]: "\"是你们之中的一个，会消失。\""
              - paragraph [ref=f1e1972]: "\"对。\"第二个林秋说。"
              - paragraph [ref=f1e1973]: "\"而活下来的那个——\""
              - paragraph [ref=f1e1974]: "\"活下来的那个，会成为下一个守夜人。\"第七个林秋说，\"会等着下一个'我'进来。会告诉他真相。会陪他下来。会——\""
              - paragraph [ref=f1e1975]: "\"会成为下一个'你'。\"林秋说。"
              - paragraph [ref=f1e1976]: "\"对。\""
              - paragraph [ref=f1e1977]: 林秋低下头，看着火柴盒。
              - paragraph [ref=f1e1978]:
                - text: 盒子的背面写着：
                - strong [ref=f1e1979]: "\"一根开门。一根照路。你只有一次机会。\""
              - paragraph [ref=f1e1980]: "\"……为什么是两根火柴？\""
              - paragraph [ref=f1e1981]: "\"因为门要打开，路要照亮。\"第七个林秋说，\"如果你只点一根——\""
              - paragraph [ref=f1e1982]: "\"你会永远困在这里。\"第二个林秋说，\"永远。\""
              - paragraph [ref=f1e1983]: 林秋把火柴盒握紧。
              - paragraph [ref=f1e1984]: 纸盒的边缘割进他的掌心。但他没有松手。
              - paragraph [ref=f1e1985]: "\"……如果我点两根呢？\""
              - paragraph [ref=f1e1986]: "\"两根一起点。\""
              - paragraph [ref=f1e1987]: "\"门会打开。路会被照亮。\""
              - paragraph [ref=f1e1988]: "\"然后——\""
              - paragraph [ref=f1e1989]: "\"然后门会关上。\"第七个林秋说，\"门关上的时候，门里的人会消失。\""
              - paragraph [ref=f1e1990]: "\"门里的人？\"林秋看向他，\"是你？\""
              - paragraph [ref=f1e1991]: "\"是我。\""
              - paragraph [ref=f1e1992]: "\"……为什么是你？\""
              - paragraph [ref=f1e1993]: "\"因为我是第七个。\"第七个林秋笑了。那种笑和之前不一样了——之前的笑是苦笑，现在的笑是真的笑。是解脱的笑。"
              - paragraph [ref=f1e1994]: "\"我在这里待了太久。\""
              - paragraph [ref=f1e1995]: "\"我已经——\""
              - paragraph [ref=f1e1996]: 他抬起手，看着自己血肉模糊的十根手指。
              - paragraph [ref=f1e1997]: "\"我已经等了很久。\""
              - paragraph [ref=f1e1998]: 林秋的眼睛开始发酸。
              - paragraph [ref=f1e1999]: "\"……我不认识你。\""
              - paragraph [ref=f1e2000]: "\"你不需要认识我。\"第七个林秋说，\"你只需要知道——\""
              - paragraph [ref=f1e2001]: "\"你点着火柴之后，第六层墙上的字会变。\""
              - paragraph [ref=f1e2002]: "\"变成'还剩六根'。\""
              - paragraph [ref=f1e2003]: "\"——然后你会成为下一个守夜人。\""
              - paragraph [ref=f1e2004]: "\"而下一个'我'进来的时候——\""
              - paragraph [ref=f1e2005]: "\"——你会像我一样，等在这里。\""
              - paragraph [ref=f1e2006]: 林秋站在那里，没有动。
              - paragraph [ref=f1e2007]: 他看着门后那个血肉模糊的自己。看着门边那个准备接替自己的自己。
