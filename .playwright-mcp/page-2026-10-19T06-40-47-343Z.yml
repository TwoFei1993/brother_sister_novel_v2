              - separator [ref=f1e1406]
              - heading "正文" [level=2] [ref=f1e1407]
              - paragraph [ref=f1e1408]: 凌晨两点四十分。
              - paragraph [ref=f1e1409]: 便利店的日光灯发出细微的电流声，像某种老旧动物在喘息。林秋把最后一批过期便当塞进回收箱，用抹布擦了擦收银台。
              - paragraph [ref=f1e1410]: 他没有注意到那张小票。
              - paragraph [ref=f1e1411]: 准确地说，小票是慢慢出现的。从收银机打印口的缝隙里，一毫米、一毫米地往外吐，像条白得发青的舌头。
              - paragraph [ref=f1e1412]: 林秋转身去货架补货时，那张纸条已经完全垂落，悬在台面边缘轻轻晃荡。
              - paragraph [ref=f1e1413]: 那是一张标准的热敏打印小票。
              - paragraph [ref=f1e1414]:
                - text: 抬头印着店铺名、地址、电话。消费时间：
                - strong [ref=f1e1415]: 03:17
                - text: 。
              - paragraph [ref=f1e1416]: 林秋愣住。
              - paragraph [ref=f1e1417]: 现在是两点四十一分。一张写着未来时间的小票，从没有顾客的收银台里自己吐了出来。
              - paragraph [ref=f1e1418]: 他下意识看向玻璃门外。空荡荡的街道，路灯把梧桐树影切成一地碎纸。卷闸外贴着的"24小时营业"海报被风吹得一张一合，像在呼吸。
              - paragraph [ref=f1e1419]: 林秋把视线收回，落在小票内容上。
              - paragraph [ref=f1e1420]:
                - text: 商品栏只有一行：
                - strong [ref=f1e1421]: 白色蜡烛 一根 ￥7.00
              - paragraph [ref=f1e1422]: 付款方式：现金。 找零：无。
              - paragraph [ref=f1e1423]: 收银员编号栏是空白的。而"顾客签名"的位置，打印出的不是文字——是一个轮廓。模糊的、五官不清的人形，像是某种被压扁后又揉皱的影子。
              - paragraph [ref=f1e1424]: 最奇怪的是小票背面。
              - paragraph [ref=f1e1425]: 翻过来，林秋看到一排手写的小字。圆珠笔，力透纸背，笔画歪斜却极其用力：
              - paragraph [ref=f1e1426]:
                - strong [ref=f1e1427]: 还剩七根。
              - paragraph [ref=f1e1428]: 后台冰柜的压缩机猛地"嘭"了一声。林秋的肩膀肉眼可见地弹了一下。
              - paragraph [ref=f1e1429]: 他打开收银机后台记录查询——03:17，没有任何交易流水。调出监控：两点四十分到三点十七分的时间段里，便利店内外零客流。收银台前空无一人。
              - paragraph [ref=f1e1430]: 没有顾客。
              - paragraph [ref=f1e1431]: 没有交易。
              - paragraph [ref=f1e1432]: 没有小票。
              - paragraph [ref=f1e1433]: 可它就在他手里。墨迹还没干透，蹭在他的拇指上，染了一点蓝黑色的指纹。
              - paragraph [ref=f1e1434]: 林秋想撕了它。手撕到一半，纸张突然在指间变烫，像被谁攥过。
              - paragraph [ref=f1e1435]: 他松手。
              - paragraph [ref=f1e1436]: 小票飘落回台面。
              - paragraph [ref=f1e1437]:
                - text: 空调出风口"呜"地转了一下。门外那块闪动的LED招牌突然黑了半秒，再亮起来时，绿色的"24"变成了红色的"
                - strong [ref=f1e1438]: "7"
                - text: "\"。"
              - paragraph [ref=f1e1439]: 林秋盯着那块招牌，脖子一阵发凉。
              - paragraph [ref=f1e1440]: 他强迫自己把目光移回小票。在灯光下，那行手写字仿佛被雾气晕开了一点。他眨了眨眼，确认自己没有看错——
              - paragraph [ref=f1e1441]:
                - strong [ref=f1e1442]: 还剩六根。
              - paragraph [ref=f1e1443]: 刚才明明是七。
              - paragraph [ref=f1e1444]: 门外的风突然大了。卷闸在风中咣当作响，海报被整个撕下来贴在地上。林秋弯腰去捡，抬起头时，玻璃上映出他自己的脸。
              - paragraph [ref=f1e1445]: 而他身后，站着别人。
              - paragraph [ref=f1e1446]:
                - emphasis [ref=f1e1447]: （持续更新，下一章预告：店里开始出现第二张小票。）
