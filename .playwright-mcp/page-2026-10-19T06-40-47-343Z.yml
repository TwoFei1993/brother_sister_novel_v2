              - paragraph [ref=f1e1738]: 第二个林秋走在他前面。
              - paragraph [ref=f1e1739]: 他举着那根未点燃的蜡烛，烛芯在空气里轻轻颤抖，像一只正在探路的触角。便利店的日光灯管在他身后越来越远，光线被货架切割成一条条细长的白带。
              - paragraph [ref=f1e1740]: 他们穿过第七排货架，穿过原本不存在的过道，穿过林秋七个小时值班从未注意到的最里面那面墙——
              - paragraph [ref=f1e1741]: 那里本该是仓库的卷帘门。
              - paragraph [ref=f1e1742]: 但现在，卷帘门消失了。取而代之的是一扇老旧的木门，漆皮剥落，露出下面灰白色的木纹。门上没有把手，只有一个黄铜钥匙孔，锁眼里透出一点点微弱的橘红色光。
              - paragraph [ref=f1e1743]: "\"这里……\"林秋的声音有些发干，\"我在这里上了两年班。\""
              - paragraph [ref=f1e1744]: "\"嗯。\"第二个林秋没有回头，\"我也是。\""
              - paragraph [ref=f1e1745]: 他把蜡烛举高了一点，烛光照亮木门的下半部分。林秋这才看见——
              - paragraph [ref=f1e1746]: 门板的下缘，有一行用黑色记号笔写的字。字迹歪歪扭扭，笔画的末端都往上挑，像是写字的人手在抖：
              - paragraph [ref=f1e1747]:
                - strong [ref=f1e1748]: "\"第七次。别忘了带火。\""
              - paragraph [ref=f1e1749]: 第二个林秋的脚步顿了顿。
              - paragraph [ref=f1e1750]: "\"……第七次。\"他重复了一遍，声音很轻，像是在确认一个让他自己也害怕的数字。然后他继续往前走，\"走吧。\""
              - paragraph [ref=f1e1751]: 他没有推门。他蹲下身，把手按在门板底部的踢脚线上，往上一推。
              - paragraph [ref=f1e1752]: 木门没有动。
              - paragraph [ref=f1e1753]: 但踢脚线的下方，露出一个黑洞洞的方形开口——一块原本嵌在木门底部的铁板被推了进去，露出一段向下的楼梯。
              - paragraph [ref=f1e1754]: 林秋看着那个黑黝黝的洞口，胃里泛起一阵恶心。
              - paragraph [ref=f1e1755]: "\"这是哪儿？\""
              - paragraph [ref=f1e1756]: "\"储物间。\"第二个林秋说，\"你以前从来没进来过。\""
              - paragraph [ref=f1e1757]: "\"我以前也没注意过这里有门。\""
              - paragraph [ref=f1e1758]: "\"嗯。\"第二个林秋往下走了第一级台阶，铁扶手在他手心里发出一声闷响，\"因为它只在特定时间打开。\""
              - paragraph [ref=f1e1759]: "\"什么时间？\""
              - paragraph [ref=f1e1760]: "\"03:17。\""
              - paragraph [ref=f1e1761]: 他没有再解释。他开始往下走。
              - paragraph [ref=f1e1762]: 林秋犹豫了一秒，跨过洞口边缘。
              - paragraph [ref=f1e1763]: 楼梯比想象中更窄。每一级台阶都只够一个人通过，两个人前后脚走，前面的人呼出的气会扑到后面人的脸上。第二个林秋身上的气味很淡——是便利店仓库里那种纸板箱和过期饮料混合的味道，混着一丝若有若无的塑料燃烧味。
              - paragraph [ref=f1e1764]: 他闻了闻自己身上。
              - paragraph [ref=f1e1765]: 同样的味道。
              - paragraph [ref=f1e1766]: 第一层楼梯到底。铁扶手在这里拐了个弯，继续往下。墙上的白漆已经开始剥落，露出下面灰黑色的水泥。潮湿的墙皮散发出一种地下室的霉味，但这种霉味不像是长年累月形成的——更像是刚生成几天的。
              - paragraph [ref=f1e1767]: 林秋的手指划过墙面。
              - paragraph [ref=f1e1768]: 墙皮是潮的。
              - paragraph [ref=f1e1769]: "\"第一层。\"第二个林秋在前面低声说。"
              - paragraph [ref=f1e1770]: 林秋这才注意到——墙壁上，用什么尖锐的东西，刻着一个数字。
              - paragraph [ref=f1e1771]:
                - strong [ref=f1e1772]: 1。
              - paragraph [ref=f1e1773]: 笔画很浅，刻痕很新，边缘还带着白色的粉尘。是用钥匙、或者指甲刻出来的。
              - paragraph [ref=f1e1774]: 林秋盯着那个数字："这是谁刻的？"
              - paragraph [ref=f1e1775]: 第二个林秋没有回答。
              - paragraph [ref=f1e1776]: 他继续往下走。
              - paragraph [ref=f1e1777]: 第二层。
              - paragraph [ref=f1e1778]:
                - text: 墙上的数字是
                - strong [ref=f1e1779]: "2"
                - text: 。刻痕比第一层深一点，边缘的粉尘少了，像是刻了很久才被人发现。
              - paragraph [ref=f1e1780]: 第三层。
              - paragraph [ref=f1e1781]:
                - strong [ref=f1e1782]: "3"
                - text: 。刻痕更深了。刻痕里有几道横向的划痕，像是在刻这个数字的时候，刻的人手在剧烈地抖。
              - paragraph [ref=f1e1783]: 第四层。
              - paragraph [ref=f1e1784]:
                - strong [ref=f1e1785]: "4"
                - text: 。数字旁边多了几个字。林秋凑近去看——是圆珠笔写的，字迹和便利店小票上的一模一样：
              - paragraph [ref=f1e1786]:
                - strong [ref=f1e1787]: "\"还剩三根。我在第三排。\""
              - paragraph [ref=f1e1788]: 第五层。
              - paragraph [ref=f1e1789]:
                - strong [ref=f1e1790]: "5"
                - text: 。没有字。但刻这个数字的人显然用了非常大的力气——刻痕深得能伸进去一根手指。数字的右下角还残留着一点干涸的、暗红色的东西。
              - paragraph [ref=f1e1791]: 林秋没敢细看。
              - paragraph [ref=f1e1792]: 第六层。
              - paragraph [ref=f1e1793]:
                - strong [ref=f1e1794]: "6"
                - text: 。刻痕是用指甲抠出来的。林秋能看到墙皮上一片一片的剥落，像是被什么野兽挠过。数字"6"的最后一笔拖得很长，延伸出去将近半米，消失在墙角的阴影里。
              - paragraph [ref=f1e1795]: 而在这条刻痕的尽头，用血——或者是和血很像的东西——写着两个极小的字：
              - paragraph [ref=f1e1796]:
                - strong [ref=f1e1797]: "\"救我。\""
              - paragraph [ref=f1e1798]: 林秋停下脚步。
              - paragraph [ref=f1e1799]: 他的腿在发抖。
              - paragraph [ref=f1e1800]: "\"……那是谁？\""
              - paragraph [ref=f1e1801]: 第二个林秋站在第六层和第七层之间的拐角处，背对着他。蜡烛的光把他工服上的褶皱照得发白。
              - paragraph [ref=f1e1802]: "\"都是你。\"他说。声音很平，像在陈述一个事实，\"每一层，都是你在某一轮的痕迹。\""
              - paragraph [ref=f1e1803]: "\"轮？\""
              - paragraph [ref=f1e1804]: "\"七轮。\"他终于转过身来。林秋看不清他的表情，但他的声音里有种说不清的东西——不是恐惧，是比恐惧更深的东西，\"便利店会在每天凌晨03:17打开这扇门。你会进来。你会走下楼梯。你会在第七层之前点着蜡烛。\""
              - paragraph [ref=f1e1805]: "\"然后？\""
              - paragraph [ref=f1e1806]: "\"然后你会进入下一轮。\"第二个林秋顿了顿，\"或者说——你会进入'下一次轮'里的'下一次'。\""
              - paragraph [ref=f1e1807]: "\"……什么意思？\""
              - paragraph [ref=f1e1808]: "\"意思是，你每次走下来，都会以为自己'终于搞清楚了'。但你没有。每次你都只差一步。每次你都只走到第六层就停。\""
              - paragraph [ref=f1e1809]: "\"为什么？\""
              - paragraph [ref=f1e1810]: "\"因为你怕。\""
              - paragraph [ref=f1e1811]: 第二个林秋的模糊面孔在烛光里轻轻晃动了一下。
              - paragraph [ref=f1e1812]: "\"你怕的不是门后面的东西。你怕的是——\""
              - paragraph [ref=f1e1813]: 他没有说下去。
              - paragraph [ref=f1e1814]: 他只是把蜡烛往林秋手里递了递。
              - paragraph [ref=f1e1815]: "\"拿着。\""
              - paragraph [ref=f1e1816]: 林秋接过蜡烛。蜡烛的触感很怪——不是蜡制的触感，更像是一根骨头，干燥、冰冷，但隐约透出一点温度。烛芯不是棉线，是一缕极细的、灰白色的头发。
              - paragraph [ref=f1e1817]: "\"火柴盒。\"第二个林秋从工服口袋里掏出一个纸盒，递给他，\"你只有两根火柴。每根可以打开一扇门。\""
              - paragraph [ref=f1e1818]: "\"门？\""
              - paragraph [ref=f1e1819]: "\"第七层的门。\"第二个林秋用手指了指下方，\"这一轮，你必须走到底。\""
              - paragraph [ref=f1e1820]: "\"然后呢？门后面是什么？\""
              - paragraph [ref=f1e1821]: 第二个林秋没有立刻回答。
              - paragraph [ref=f1e1822]: 他低头看着自己空着的手，沉默了三秒。
              - paragraph [ref=f1e1823]: "\"我不知道。\"他说，\"我走到过第六层。每次都走到第六层。然后我就……\""
              - paragraph [ref=f1e1824]: "\"就什么？\""
              - paragraph [ref=f1e1825]: "\"就忘了我为什么要走下去。\""
              - paragraph [ref=f1e1826]: 楼梯间的空气冷得发颤。
              - paragraph [ref=f1e1827]: 林秋把火柴盒握在手里。纸盒很轻，但他的手指在发抖，盒角在指缝间一颤一颤的。他翻过火柴盒，看到背面用圆珠笔写着两行字：
              - paragraph [ref=f1e1828]:
                - strong [ref=f1e1829]: "\"一根开门。一根照路。\""
                - strong [ref=f1e1830]: "\"你只有一次机会。\""
              - paragraph [ref=f1e1831]: 第七层的门就在下面。
              - paragraph [ref=f1e1832]: 隔着最后几级台阶，林秋能听到门那边传来的声音。极轻的，断断续续的。
              - paragraph [ref=f1e1833]: 是人在说话。
              - paragraph [ref=f1e1834]: 而且是两个人。
              - paragraph [ref=f1e1835]: 两个一模一样的声音在重复着同一句话：
              - paragraph [ref=f1e1836]:
                - strong [ref=f1e1837]: "\"我……我要……我必须……我……\""
              - paragraph [ref=f1e1838]: 第二个林秋突然伸手，按住了林秋的肩膀。
              - paragraph [ref=f1e1839]: "\"这扇门后面不是答案。\"他说，声音比之前更轻，\"是问题。\""
              - paragraph [ref=f1e1840]: "\"什么问题？\""
              - paragraph [ref=f1e1841]: "\"——你愿不愿意成为下一个'我'的问题。\""
              - paragraph [ref=f1e1842]: 他松开了手。
              - paragraph [ref=f1e1843]: "\"想清楚再开。\""
              - paragraph [ref=f1e1844]:
                - emphasis [ref=f1e1845]: （持续更新，下一章预告：林秋点燃火柴——门后是第七个林秋，正在用手指抠墙。）
