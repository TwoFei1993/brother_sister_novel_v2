                    - listitem [ref=f1e1473]: 便利店货架某处，突然亮起微弱烛光
              - separator [ref=f1e1474]
              - heading "正文" [level=2] [ref=f1e1475]
              - paragraph [ref=f1e1476]: 那张小票没有离开收银台。
              - paragraph [ref=f1e1477]: 林秋试过三次。第一次他把它揉成团扔进垃圾桶，三十秒后它重新出现在打印口，纸面平整得像从未被触碰。第二次他用打火机烧，火焰刚舔上纸角，纸张便自己从指缝间滑走，落回原位。第三次他干脆把它塞进抽屉锁起来——拉开抽屉，里面空无一物。再一回头，小票又挂在收银台边缘。
              - paragraph [ref=f1e1478]: 他不再试了。
              - paragraph [ref=f1e1479]: 凌晨三点整。店里的冰柜发出均匀的嗡鸣。玻璃门外的风停了，但那块LED招牌还在闪。红色的"7"。
              - paragraph [ref=f1e1480]: 林秋盯着那块招牌看了一会儿，又把视线压回小票。
              - paragraph [ref=f1e1481]:
                - strong [ref=f1e1482]: 还剩六根。
              - paragraph [ref=f1e1483]: 他揉了揉眼睛。再看。
              - paragraph [ref=f1e1484]:
                - strong [ref=f1e1485]: 还剩五根。
              - paragraph [ref=f1e1486]: 他倒吸一口凉气，整个人往后退了半步。收银机屏幕的蓝光打在他脸上，把他眼下的阴影染得更深。
              - paragraph [ref=f1e1487]: "\"这不对……\"他喃喃。"
              - paragraph [ref=f1e1488]: 他开始仔细检查小票的每一处。从正面翻到背面，拇指的纹路碾过纸面。热敏纸特有的银灰色涂层在指腹下沙沙作响。
              - paragraph [ref=f1e1489]: 然后他发现新东西。
              - paragraph [ref=f1e1490]: 小票最下方，"还剩五根"那几个字下面，原本什么都没有的空白处，缓慢地——非常缓慢地——开始渗出墨迹。
              - paragraph [ref=f1e1491]: 像是有人正在此刻，用一支看不见的笔，在纸面上写字。
              - paragraph [ref=f1e1492]: 一划。一划。又一划。
              - paragraph [ref=f1e1493]:
                - strong [ref=f1e1494]: 1-3-8-0-0-2-5-7-4-0-3-1。
              - paragraph [ref=f1e1495]: 十一位数字。
              - paragraph [ref=f1e1496]: 他认得这个开头。本地手机号段。
              - paragraph [ref=f1e1497]: 笔迹写完最后一个"1"后停住了。然后，在号码下方，又多出三个极小的字。圆珠笔，和"还剩X根"是同一种字迹，但更潦草，几乎是刻进纸里的：
              - paragraph [ref=f1e1498]:
                - strong [ref=f1e1499]: 现在就拨。
              - paragraph [ref=f1e1500]: 林秋的喉结上下滚了一下。
              - paragraph [ref=f1e1501]: 他是个无神论者。至少三个小时前还是。他相信超市监控、收银系统、法庭上可被质证的物证。他相信人死了就是死了，不会有"还剩几根"这种话。
              - paragraph [ref=f1e1502]: 但他从来没在凌晨三点的便利店里，一个人面对过一张会自己变小票的数字。
              - paragraph [ref=f1e1503]: 他掏出手机。
              - paragraph [ref=f1e1504]:
                - text: 屏幕亮起，锁屏时间是
                - strong [ref=f1e1505]: 03:17
                - text: 。
              - paragraph [ref=f1e1506]: 林秋的手悬在拨号键上方。屏幕冷光照在他脸上，把他的瞳孔映成两个针孔大小的黑点。
              - paragraph [ref=f1e1507]:
                - emphasis [ref=f1e1508]: ——是巧合。
                - text: 他想。
                - emphasis [ref=f1e1509]: 本地号段，13开头的有上百万个。
              - paragraph [ref=f1e1510]: 他按下号码。
              - paragraph [ref=f1e1511]: "\"嘟——\""
              - paragraph [ref=f1e1512]: 第一声忙音。便利店的空调吐出冷气，贴在他后颈。
              - paragraph [ref=f1e1513]: "\"嘟——\""
              - paragraph [ref=f1e1514]: 第二声。冰柜的压缩机突然停止运转，店里瞬间安静得不正常。
              - paragraph [ref=f1e1515]: "\"嘟——\""
              - paragraph [ref=f1e1516]: 第三声。
              - paragraph [ref=f1e1517]: "\"咔。\""
              - paragraph [ref=f1e1518]: 接通了。
              - paragraph [ref=f1e1519]: 没有问候，没有彩铃，没有"您拨打的号码正在通话中"。电话那头是空旷的电流底噪，像某个人把手机举在风很大的地方。
              - paragraph [ref=f1e1520]: 然后那个声音来了。
              - paragraph [ref=f1e1521]: 林秋的手机从耳边滑落了一寸。
              - paragraph [ref=f1e1522]: 那是他自己的声音。
              - paragraph [ref=f1e1523]: 音色，语调，甚至那种说话前习惯性吞咽口水的小动作，全是他。从声波震动耳膜的那一瞬间，他就认出来了——那就是他自己。
              - paragraph [ref=f1e1524]: 但那个人说的是：
              - paragraph [ref=f1e1525]:
                - strong [ref=f1e1526]: "\"……你还没决定吗？\""
              - paragraph [ref=f1e1527]: 林秋张了张嘴。喉咙像被人攥住，发不出声。
              - paragraph [ref=f1e1528]: 他听见自己说——不，是**那个"他"**说：
              - paragraph [ref=f1e1529]:
                - strong [ref=f1e1530]: "\"再不买，蜡烛就不够了。\""
              - paragraph [ref=f1e1531]: 林秋终于找回自己的舌头："……你是谁？"
              - paragraph [ref=f1e1532]: 那个声音沉默了两秒。然后，用一种几乎是温柔的、劝慰的语气说：
              - paragraph [ref=f1e1533]:
                - strong [ref=f1e1534]: "\"我是你。三点十七分的你。\""
              - paragraph [ref=f1e1535]: 林秋的背脊开始冒冷汗。
              - paragraph [ref=f1e1536]: "\"你在哪？\""
              - paragraph [ref=f1e1537]:
                - strong [ref=f1e1538]: "\"和你站在同一个地方。\""
                - text: 那个声音顿了顿，似乎在便利店门口转了转身，
                - strong [ref=f1e1539]: "\"……店里更亮一些。我记得我犹豫了很久。\""
              - paragraph [ref=f1e1540]: 林秋猛地回头看向玻璃门。
              - paragraph [ref=f1e1541]: 玻璃上映着他的倒影。只有他一个人。空荡荡的货架，冰柜的白光，地砖反着冷色。
              - paragraph [ref=f1e1542]: 但他突然意识到哪里不对。
              - paragraph [ref=f1e1543]: 玻璃门的右上角，他记得那里原本贴着一张"禁止吸烟"的标识。现在标识还在，但标识的下方——
              - paragraph [ref=f1e1544]: 玻璃内侧，不知道什么时候，多了一个手印。
              - paragraph [ref=f1e1545]: 五指张开，掌心朝外。
              - paragraph [ref=f1e1546]: 像有人正贴在门内，从外面看进来。
              - paragraph [ref=f1e1547]: 林秋还没来得及反应，手机里的"他"又开口了：
              - paragraph [ref=f1e1548]:
                - strong [ref=f1e1549]: "\"你看到我了。\""
                - text: 那个声音轻轻笑了一下，
                - strong [ref=f1e1550]: "\"不用怕。我那时候也害怕。但后来我懂了——\""
              - paragraph [ref=f1e1551]: 声音低下去，低到几乎要淹没在电流的沙沙声里：
              - paragraph [ref=f1e1552]:
                - strong [ref=f1e1553]: "\"——是你自己去买的。\""
              - paragraph [ref=f1e1554]:
                - strong [ref=f1e1555]: "\"第四根蜡烛会替你回答。\""
              - paragraph [ref=f1e1556]: "\"咔。\""
              - paragraph [ref=f1e1557]: 挂断了。
              - paragraph [ref=f1e1558]:
                - text: 林秋的耳边是忙音。屏幕跳回拨号界面，通话记录显示：
                - strong [ref=f1e1559]: 00:47
                - text: 。
              - paragraph [ref=f1e1560]: 他盯着那个数字，脑子里一片空白。
              - paragraph [ref=f1e1561]: 然后他听见了别的声音。
              - paragraph [ref=f1e1562]: 非常轻。从他身后。从便利店的深处。从他一个人值守了七个小时、从未注意过的最里面那排货架——
              - paragraph [ref=f1e1563]:
                - strong [ref=f1e1564]: "\"噼。\""
              - paragraph [ref=f1e1565]: 一声极细微的爆裂。
              - paragraph [ref=f1e1566]: 林秋转过身。
              - paragraph [ref=f1e1567]: 便利店的尽头，第七排货架，最底层靠墙的位置。那里本该堆着整箱的矿泉水和纸巾。
              - paragraph [ref=f1e1568]: 现在那里亮着一点光。
              - paragraph [ref=f1e1569]: 橘红色的，微弱的，一明一灭。
              - paragraph [ref=f1e1570]: 是烛火。
              - paragraph [ref=f1e1571]: 一根白色的蜡烛，不知被谁点燃，插在矿泉水箱的缝隙里。火焰像一只眼睛，安静地望着他。
              - paragraph [ref=f1e1572]: 而蜡烛旁边的纸箱上，贴着一张新的小票。
              - paragraph [ref=f1e1573]: 他没有走过去。
              - paragraph [ref=f1e1574]: 因为他知道，那张纸条上一定写着：
              - paragraph [ref=f1e1575]:
                - strong [ref=f1e1576]: 还剩四根。
              - paragraph [ref=f1e1577]:
                - emphasis [ref=f1e1578]: （持续更新，下一章预告：林秋开始在货架间发现第三根蜡烛，和"我"留下的第一张字条。）
