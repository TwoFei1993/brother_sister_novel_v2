              - paragraph [ref=f1e1608]: 林秋花了二十分钟说服自己去看监控。
              - paragraph [ref=f1e1609]: 不是不想看。是身体本能地拒绝。人在面对无法解释的事物时，会先拒绝承认它的存在，然后再被迫接受——而"被迫接受"往往比"从未发生"更让人崩溃。
              - paragraph [ref=f1e1610]: 他坐在收银台后面，面前是连接监控的旧台式机。屏幕亮起来时，灰白色的监控画面在黑暗的便利店里显得格外刺眼。
              - paragraph [ref=f1e1611]: 他先回放了从凌晨一点到现在的录像。
              - paragraph [ref=f1e1612]: 01:00——正常。他一个人坐在收银台后面看手机。 01:30——正常。他在补货，弯腰把泡面塞进货架。 02:00——正常。他在擦收银台。 02:30——正常。他去了一趟洗手间，画面里没人，但收银台上多了一杯咖啡。 02:45——正常。
              - paragraph [ref=f1e1613]: 03:00——
              - paragraph [ref=f1e1614]: 林秋的手停在鼠标上。
              - paragraph [ref=f1e1615]: 03:00的画面对应的是便利店大门方向。画面左上角时间戳正常跳动。但门外的卷闸下，玻璃门上映着的不是空荡荡的街道。
              - paragraph [ref=f1e1616]: 是一个人。
              - paragraph [ref=f1e1617]: 侧身，贴着玻璃，站在门外的黑暗里。只能看到模糊的轮廓，像被水泡过的铅笔画。
              - paragraph [ref=f1e1618]: 林秋屏住呼吸，把进度条往回拉了一秒。
              - paragraph [ref=f1e1619]: 没有人。
              - paragraph [ref=f1e1620]: 再拉回来。
              - paragraph [ref=f1e1621]: 又出现了。
              - paragraph [ref=f1e1622]: 不是连贯的——是跳帧式的。每隔一秒，玻璃门外的倒影就多一个人形，但人形的边缘模糊不清，像某种尚未加载完成的图像。
              - paragraph [ref=f1e1623]: 他点开便利店内部的另一个摄像头。画面里是他常坐的收银台。
              - paragraph [ref=f1e1624]: 03:05。03:10。03:15。
              - paragraph [ref=f1e1625]: 林秋在画面里。他坐在那里，低头看手机，屏幕的冷光照在他脸上。
              - paragraph [ref=f1e1626]: 他记得自己那时候在看什么——外卖群里的差评吐槽。完全正常。
              - paragraph [ref=f1e1627]: 03:17。
              - paragraph [ref=f1e1628]: 画面里的他抬起了头。
              - paragraph [ref=f1e1629]: 不是慢慢抬的。是猛地、骤然地，像被什么惊动。他直直地看向——
              - paragraph [ref=f1e1630]: 镜头。
              - paragraph [ref=f1e1631]: 林秋的血液凉了半截。
              - paragraph [ref=f1e1632]:
                - text: 画面里的"他"看着镜头，但看的不是镜头这个物件。
                - strong [ref=f1e1633]: 是镜头后面的人。
              - paragraph [ref=f1e1634]: 那个"他"的嘴唇动了一下。
              - paragraph [ref=f1e1635]: 林秋把画面放大。画质模糊，色彩有偏差，但他能看出那个口型。
              - paragraph [ref=f1e1636]:
                - strong [ref=f1e1637]: "\"你找到我了。\""
              - paragraph [ref=f1e1638]: 画面里的他说完这句话，便站了起来。但他没有往门口走，也没有往洗手间走。
              - paragraph [ref=f1e1639]: 他往便利店深处走去。
              - paragraph [ref=f1e1640]: 第三排货架。第四排。第五排。
              - paragraph [ref=f1e1641]: 他越走越深，越走越慢，像在寻找什么。林秋看着画面里的自己消失在第七排货架的尽头——监控画面到这里就截止了，因为摄像头只能覆盖到第六排。
              - paragraph [ref=f1e1642]: 第七排以后的区域，是监控盲区。
              - paragraph [ref=f1e1643]: 林秋慢慢转过头，看向自己身后的便利店深处。
              - paragraph [ref=f1e1644]: 第七排货架。那里还亮着一点微弱的橘红色光。蜡烛还在烧。
              - paragraph [ref=f1e1645]: 他站起来。椅子在地砖上刮出一声尖锐的响。
              - paragraph [ref=f1e1646]: "\"我刚才没有动过。\"他对自己说。声音很轻，像在说服某个不在场的人。\"03:17的时候我在看手机。我没动过。\""
              - paragraph [ref=f1e1647]: 他开始往货架深处走。
              - paragraph [ref=f1e1648]: 第三排。第四排。第五排。
              - paragraph [ref=f1e1649]: 他走得比画面里那个"自己"快。脚步落在地砖上的声音在空荡荡的店里回响，异常清晰。冰柜的嗡鸣声不知什么时候停了，便利店里安静得像一个密封的盒子。
              - paragraph [ref=f1e1650]: 第六排货架。
              - paragraph [ref=f1e1651]: 前面就是第七排。
              - paragraph [ref=f1e1652]: 林秋停下脚步。
              - paragraph [ref=f1e1653]: 不是因为害怕。是因为他看到了不该看到的东西。
              - paragraph [ref=f1e1654]: 第六排和第七排货架之间的过道——他每天走过无数次的过道——变长了。
              - paragraph [ref=f1e1655]:
                - text: 不是错觉。不是光线昏暗造成的视觉误差。是物理意义上的，
                - strong [ref=f1e1656]: 变长了
                - text: 。
              - paragraph [ref=f1e1657]: 原本只有三步的距离，现在他站在第六排往里看，能看到过道延伸出去至少二十米。两侧的货架在远处变成模糊的色块，像被水稀释过的水彩。
              - paragraph [ref=f1e1658]: 而那根蜡烛的光，就在这条变长的过道尽头。
              - paragraph [ref=f1e1659]: 林秋站着没动。他的理智告诉他应该退回去，应该报警，应该冲出便利店——但他的脚像被钉在地上。
              - paragraph [ref=f1e1660]: 然后他听到了声音。
              - paragraph [ref=f1e1661]: 从过道深处传来的。
              - paragraph [ref=f1e1662]: 不是蜡烛燃烧的细微爆裂。是脚步。
              - paragraph [ref=f1e1663]: 有人正在往他这个方向走。
              - paragraph [ref=f1e1664]: 每一步都踩在过道中央，每一步都不紧不慢，每一步的间隔都非常均匀——像节拍器。
              - paragraph [ref=f1e1665]: 而那个脚步声的节奏，林秋再熟悉不过。
              - paragraph [ref=f1e1666]: 那是他自己走路的节奏。
              - paragraph [ref=f1e1667]: 过道深处的橘红色光开始晃动了。是有人走过的气流带动的烛焰。烛光把一个影子投在第六排货架的侧面——
              - paragraph [ref=f1e1668]: 影子的轮廓，是林秋的轮廓。
              - paragraph [ref=f1e1669]: 肩膀的高度。头发的长度。甚至右肩微微下沉的习惯性姿势。
              - paragraph [ref=f1e1670]: 那个"他"正在走过来。越来越近。
              - paragraph [ref=f1e1671]: 林秋终于动了一下。他往后退了半步，背撞到了第六排货架的边缘，货架上的薯片袋发出窸窣的响。
              - paragraph [ref=f1e1672]: 脚步声停了。
              - paragraph [ref=f1e1673]: 过道深处，烛光稳稳地燃着。
              - paragraph [ref=f1e1674]: 一个声音从黑暗中传来。是他的声音。沙哑的，带着一种难以形容的疲惫：
              - paragraph [ref=f1e1675]:
                - strong [ref=f1e1676]: "\"……你比我当时还慢。\""
              - paragraph [ref=f1e1677]:
                - strong [ref=f1e1678]: "\"我等了你很久。\""
              - paragraph [ref=f1e1679]: 烛光后面，缓缓走出一个人。
              - paragraph [ref=f1e1680]: 穿着便利店的工服。脸和监控里一样模糊，五官像被水泡过。但那个姿态，那个右肩微微下沉的习惯，那个说话前先吞咽口水的小动作——
              - paragraph [ref=f1e1681]: 是林秋。
              - paragraph [ref=f1e1682]: 是他自己。
              - paragraph [ref=f1e1683]: 那个"他"举起了手里的东西。
              - paragraph [ref=f1e1684]: 是一根白色的蜡烛。没有点燃。
              - paragraph [ref=f1e1685]:
                - strong [ref=f1e1686]: "\"还剩两根。\""
                - text: 那个"他"说，声音平静得像在念一份收据，
                - strong [ref=f1e1687]: "\"一根给你。一根给我。\""
              - paragraph [ref=f1e1688]:
                - strong [ref=f1e1689]: "\"但你要先回答我一个问题。\""
              - paragraph [ref=f1e1690]:
                - strong [ref=f1e1691]: "\"——你还记得自己是怎么进来的吗？\""
              - paragraph [ref=f1e1692]: 林秋的瞳孔猛地收缩。
              - paragraph [ref=f1e1693]: 他想回答。他当然记得。他是今天下午两点来上班的，从员工通道进来的，刷卡，签到，换工服。一切正常。
              - paragraph [ref=f1e1694]: 但当他试图回忆那个画面时，他的脑子里只有一片空白。
              - paragraph [ref=f1e1695]:
                - text: 不是"忘了"。是
                - strong [ref=f1e1696]: 根本不存在
                - text: 。
              - paragraph [ref=f1e1697]: 他没有任何关于"今天下午两点上班"的记忆。他只记得自己"一直"在这里。从凌晨一点到现在的每一秒，他都在这里。中间没有"之前"。
              - paragraph [ref=f1e1698]: 林秋张了张嘴，什么都说不出来。
              - paragraph [ref=f1e1699]: 那个"他"看着他，模糊的脸上似乎浮现出一丝笑意。
              - paragraph [ref=f1e1700]:
                - strong [ref=f1e1701]: "\"没关系。\""
                - text: 他说，把手里的蜡烛往前递了递，
                - strong [ref=f1e1702]: "\"蜡烛会帮你想起来的。\""
              - paragraph [ref=f1e1703]:
                - strong [ref=f1e1704]: "\"你只需要点着它。\""
              - paragraph [ref=f1e1705]:
                - emphasis [ref=f1e1706]: （持续更新，下一章预告：林秋接过蜡烛——火柴盒里只剩两根火柴。）
