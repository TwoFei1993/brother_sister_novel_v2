              - paragraph [ref=f1e2228]: 走廊里响起一声尖锐的嘶吼。
              - paragraph [ref=f1e2229]: "\"你们……竟然敢伤我们！\""
              - paragraph [ref=f1e2230]: 那支商队的"人"们开始变形。他们的皮肤像纸一样裂开，露出下面青灰色的、布满鳞片的躯体。他们的眼睛变得猩红，嘴里长出獠牙，指甲延伸成锋利的爪子。
              - paragraph [ref=f1e2231]: "\"哥，是妖族！\"林雪喊道，\"而且不止一个——我们捅了妖窝了！\""
              - paragraph [ref=f1e2232]: 林枫的心沉了下去。
              - paragraph [ref=f1e2233]: 一个两个妖族他还能应付，但这里至少有三十个，而且能伪装成人类、隐藏妖气这么久，实力绝对不弱。
              - paragraph [ref=f1e2234]: "\"往楼下退！\""
              - paragraph [ref=f1e2235]: 林枫一把拉起林雪，两人从二楼窗户一跃而下。
              - paragraph [ref=f1e2236]: 客栈的院子里已经站满了妖族。他们形成了一个完美的包围圈，留给林枫兄妹的只有一个方向——
              - paragraph [ref=f1e2237]: 黑风岭。
              - paragraph [ref=f1e2238]: "\"跑吧。\"那个女人——现在已经变成了一条人首蛇身的女妖——的声音从楼上传来，\"我们会在黑风岭等你们。\""
              - paragraph [ref=f1e2239]: "\"那里，才是你们真正的葬身之地。\""
              - paragraph [ref=f1e2240]: 林枫没有犹豫，拉着林雪就往黑风岭的方向冲去。
              - paragraph [ref=f1e2241]: 晨光在他们身后拉出两道长长的影子。
              - paragraph [ref=f1e2242]: 而他们的前方，是连绵起伏的黑色山峦，像一头蛰伏的巨兽，正等待猎物自投罗网。
