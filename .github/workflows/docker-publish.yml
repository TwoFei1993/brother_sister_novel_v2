# v3 生产镜像自动构建发布（GHCR）
#
# 触发：main 分支 v3/** 有变更时构建并推送
# 产物：ghcr.io/twofei1993/brother_sister_novel_v2:latest（+ sha 标签）
#
# 部署端（Sealos / VPS / Railway 等任何能跑 Docker 的平台）：
#   docker run -d -p 3001:3001 -e ACCESS_PASSWORD=<你的密码> \
#     -v novel-data:/app/data ghcr.io/twofei1993/brother_sister_novel_v2:latest
#
# 权限：仓库 Settings → Actions → Workflow permissions 需允许 GITHUB_TOKEN 写 packages
#       （默认只读时首次运行会 403，改成 Read and write 即可）

name: docker-publish

on:
  push:
    branches: [main]
    paths:
      - 'v3/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/brother_sister_novel_v2
          tags: |
            latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./v3
          file: ./v3/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 国内服务器快速拉取：同步推送到腾讯云镜像仓库（TCR 个人版，免费）
      # 启用条件（三步）：① Actions Variables 添加 TCR_ENABLED=true、TCR_NAMESPACE=<你的命名空间>
      # ② Secrets 添加 TCR_USERNAME / TCR_PASSWORD（TCR 控制台「访问凭证」生成）
      # ③ TCR 控制台先创建同名命名空间；不配置则本步自动跳过（走 GHCR）
      - name: Login to Tencent TCR
        if: vars.TCR_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Push to Tencent TCR
        if: vars.TCR_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./v3
          file: ./v3/Dockerfile
          push: true
          tags: ccr.ccs.tencentyun.com/${{ vars.TCR_NAMESPACE }}/brother_sister_novel_v2:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
